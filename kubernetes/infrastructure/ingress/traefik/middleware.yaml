apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-allowlist
  namespace: ingress
spec:
  ipAllowList:
    sourceRange:
      - 10.10.0.0/16
      # tailnet clients reach the dashboard via the advertised subnet routes
      - 100.64.0.0/10
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-allowlist
  namespace: ingress
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
