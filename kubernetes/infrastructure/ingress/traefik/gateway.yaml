apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: ingress
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
    # Do not set hostname. Listener matches all hostnames. Both 0xbf.ch
    # and *.0xbf.ch attach here. Wildcard filter does not match bare domain.
    - name: websecure
      protocol: HTTPS
      port: 8443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-domain-tls
    - name: websecure-internal
      protocol: HTTPS
      port: 8443
      hostname: "*.internal"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: internal-hosts-tls
    # TCP for forgejo git SSH on the clean 22. Port must match the gitssh
    # entrypoint. WAN 22 (already forwarded) ends here:
    # ssh://git@git.0xbf.ch/owner/repo.git
    - name: gitssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All
    # TCP for the sshmux (username router) on WAN 2222. The apex TUI rides
    # it: ssh -p 2222 0xbf.ch
    - name: muxssh
      protocol: TCP
      port: 2222
      allowedRoutes:
        namespaces:
          from: All
    # TCP for devil SSH. Port matches the devilssh entrypoint. No hostPort.
    # No WAN. Access via LAN and tailnet only. 2223 since git took 22; the
    # mux took 2222.
    - name: devilssh
      protocol: TCP
      port: 2223
      allowedRoutes:
        namespaces:
          from: All
    # PDS handles use <name>.pds.0xbf.ch. This needs second-level wildcard
    # cert. Listeners on same port with different hostnames are distinct.
    # Most specific hostname wins.
    - name: websecure-pds
      protocol: HTTPS
      port: 8443
      hostname: "*.pds.0xbf.ch"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: pds-handles-wildcard-tls
