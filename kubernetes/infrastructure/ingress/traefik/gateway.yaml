apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: ingress
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
    # No hostname on purpose: the listener matches all hostnames, so both the
    # bare 0xbf.ch and *.0xbf.ch subdomains attach here. Do not add a hostname
    # filter — a wildcard would stop matching the bare domain again.
    - name: websecure
      protocol: HTTPS
      port: 8443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-domain-tls
    - name: websecure-internal
      protocol: HTTPS
      port: 8443
      hostname: "*.internal"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-internal-tls
    # Raw TCP for forgejo git-over-SSH (TCPRoute). Port must match the
    # gitssh entrypoint (22 — WAN 22 → git, the dev box takes 2222 later),
    # not the exposed Service port.
    - name: gitssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All
    # Raw TCP for devil ssh (TCPRoute devil-ssh). Like gitssh the port
    # matches the devilssh entrypoint (2222) — but no hostPort and no WAN
    # exposure: LAN + tailnet only.
    - name: devilssh
      protocol: TCP
      port: 2222
      allowedRoutes:
        namespaces:
          from: All
    # PDS account handles (<name>.pds.0xbf.ch) — second-level wildcard needs
    # its own cert (pds-handles-wildcard-tls); same-port listeners are
    # distinguished by hostname, most specific wins (see websecure-internal).
    - name: websecure-pds
      protocol: HTTPS
      port: 8443
      hostname: "*.pds.0xbf.ch"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: pds-handles-wildcard-tls
