apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: ingress
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
    # Do not set hostname. Listener matches all hostnames. Both 0xbf.ch
    # and *.0xbf.ch attach here. Wildcard filter does not match bare domain.
    - name: websecure
      protocol: HTTPS
      port: 8443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-domain-tls
    - name: websecure-internal
      protocol: HTTPS
      port: 8443
      hostname: "*.internal"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-internal-tls
    # TCP for forgejo git SSH. Port must match gitssh entrypoint. Apex
    # uses port 22 now. Gitssh uses port 2223.
    - name: gitssh
      protocol: TCP
      port: 2223
      allowedRoutes:
        namespaces:
          from: All
    # TCP for devil SSH. Port matches devilssh entrypoint. No hostPort.
    # No WAN. Access via LAN and tailnet only.
    - name: devilssh
      protocol: TCP
      port: 2222
      allowedRoutes:
        namespaces:
          from: All
    # TCP for apex SSH portfolio. Port 22 serves portfolio. Use ssh 0xbf.ch.
    - name: apexssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All
    # PDS handles use <name>.pds.0xbf.ch. This needs second-level wildcard
    # cert. Listeners on same port with different hostnames are distinct.
    # Most specific hostname wins.
    - name: websecure-pds
      protocol: HTTPS
      port: 8443
      hostname: "*.pds.0xbf.ch"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: pds-handles-wildcard-tls
