apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.6.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  targetNamespace: ingress
  install:
    createNamespace: true
  values:
    deployment:
      kind: Deployment
      replicas: 1
    # Use Recreate. Entrypoints bind hostPorts on worker. Second pod cannot
    # start while old pod holds ports.
    updateStrategy:
      type: Recreate
    service:
      enabled: true
      type: LoadBalancer
    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
        # Zyxel router does not forward to LB IP. Traefik binds to rbpi
        # for WAN access.
        hostPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
        hostPort: 443
      gitssh:
        port: 2223
        expose:
          default: true
        exposedPort: 2223
        # Forgejo git-ssh moved from 22 to 2223. Apex uses 22 now. Router
        # forwards 2223 to rbpi:2223 for WAN. Clone via
        # ssh://git@git.0xbf.ch:2223/<owner>/<repo>.git
        hostPort: 2223
      devilssh:
        port: 2222
        expose:
          default: true
        exposedPort: 2222
        # No hostPort. Devil SSH uses LB IP only. LAN and tailnet only.
        # Router does not forward 2222. Port 2222 stays reserved for future
        # dev box.
      apexssh:
        port: 22
        expose:
          default: true
        exposedPort: 22
        # Portfolio uses 22 for ssh 0xbf.ch. Forgejo moved to 2223. Dev
        # box keeps 2222. Router forwards 22 to rbpi:22 for WAN.
        hostPort: 22
    providers:
      kubernetesGateway:
        enabled: true
        # TCPRoute needs experimental channel. Forgejo git-ssh uses TCPRoute.
        experimentalChannel: true
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: false
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`dashboard.internal`)
        entryPoints:
          - websecure
        middlewares:
          - name: internal-allowlist
        tls:
          secretName: wildcard-internal-tls
    gateway:
      enabled: false
    metrics:
      prometheus:
        enabled: true
        # Use dedicated metrics Service on 9100 for Prometheus. LB Service
        # does not expose metrics.
        service:
          enabled: true
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
