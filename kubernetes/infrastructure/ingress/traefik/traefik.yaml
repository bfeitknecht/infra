apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "43.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  targetNamespace: ingress
  install:
    createNamespace: true
    # CRDs come from the traefik-crds Kustomization (cluster/crds.yaml).
    crds: Skip
  values:
    deployment:
      kind: Deployment
      replicas: 1
    # Router forwards WAN 80/443/22/2222 to rbpi. hostPorts work only there.
    nodeSelector:
      kubernetes.io/hostname: rbpi
    # Use Recreate. Entrypoints bind hostPorts on worker. Second pod cannot
    # start while old pod holds ports.
    updateStrategy:
      type: Recreate
    service:
      enabled: true
      # Chart 43: the Service type moved under spec.
      spec:
        type: LoadBalancer
    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
        # Zyxel router does not forward to LB IP. Traefik binds to rbpi
        # for WAN access.
        hostPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
        hostPort: 443
      gitssh:
        port: 22
        expose:
          default: true
        exposedPort: 22
        # Git on the clean 22: ssh://git@git.0xbf.ch/<owner>/<repo>.git.
        # Router forwards 22 to rbpi:22 for WAN (rule unchanged since the
        # apex era).
        hostPort: 22
      muxssh:
        port: 2222
        expose:
          default: true
        exposedPort: 2222
        # The sshmux (username router) owns WAN 2222: apex is the
        # default username. Router forwards 2222 to rbpi:2222.
        hostPort: 2222
    providers:
      kubernetesGateway:
        enabled: true
        # TCPRoute needs experimental channel. Forgejo git-ssh uses TCPRoute.
        experimentalChannel: true
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: false
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.internal`)
        entryPoints:
          - websecure
        middlewares:
          - name: internal-allowlist
        tls:
          secretName: internal-hosts-tls
    gateway:
      enabled: false
    metrics:
      prometheus:
        enabled: true
        # Use dedicated metrics Service on 9100 for Prometheus. LB Service
        # does not expose metrics.
        service:
          enabled: true
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
