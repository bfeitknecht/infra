apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.6.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  targetNamespace: ingress
  install:
    createNamespace: true
  values:
    deployment:
      kind: Deployment
      replicas: 1
    # Recreate: the entrypoints bind hostPorts (80/443/22) on the single
    # worker — a surge pod can never schedule while the old one holds them
    # (maxUnavailable: 0 deadlock).
    updateStrategy:
      type: Recreate
    service:
      enabled: true
      type: LoadBalancer
    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
        # Zyxel router refuses virtual LB IP (10.10.20.128),
        # so WAN entry binds Traefik directly to rbpi (10.10.20.10).
        hostPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
        hostPort: 443
      gitssh:
        port: 2223
        expose:
          default: true
        exposedPort: 2223
        # Forgejo git-ssh moved off 22 when the apex portfolio claimed the
        # canonical port. WAN entry like 80/443 (the Zyxel router refuses the
        # LB IP), so the router forwards 2223 → rbpi:2223 as well.
        # Clone URLs: ssh://git@git.0xbf.ch:2223/<owner>/<repo>.git
        hostPort: 2223
      devilssh:
        port: 2222
        expose:
          default: true
        exposedPort: 2222
        # NO hostPort: devil ssh is LAN/tailnet-only via the LB IP — the
        # router forwards nothing on 2222, WAN 2222 stays reserved for the
        # future dev box (unlike web/websecure/gitssh, the WAN doors).
        # Gateway: TCPRoute devil-ssh → headless devil Service → VM :2222.
      apexssh:
        port: 22
        expose:
          default: true
        exposedPort: 22
        # The portfolio is the site's SSH face, so it owns 22: `ssh 0xbf.ch`.
        # Forgejo git-ssh moved to 2223, the dev box keeps 2222. WAN entry
        # like 80/443 (the Zyxel router refuses the LB IP), so the router
        # forwards 22 → rbpi:22 — the rule it already had for git.
        hostPort: 22
        # Gateway: TCPRoute apex-ssh → Service apex-tui → pod :2222.
    providers:
      kubernetesGateway:
        enabled: true
        # TCPRoute (forgejo git-ssh) is experimental-channel only
        experimentalChannel: true
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: false
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`dashboard.internal`)
        entryPoints:
          - websecure
        middlewares:
          - name: internal-allowlist
        tls:
          secretName: wildcard-internal-tls
    gateway:
      enabled: false
    metrics:
      prometheus:
        enabled: true
        # dedicated metrics Service (ingress-traefik-metrics:9100) —
        # the LB service carries only web/websecure/gitssh/devilssh
        # so gatus + the ServiceMonitor scrape this one
        service:
          enabled: true
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
