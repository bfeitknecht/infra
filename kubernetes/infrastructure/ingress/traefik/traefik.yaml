apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.6.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  targetNamespace: ingress
  install:
    createNamespace: true
  values:
    deployment:
      kind: Deployment
      replicas: 1
    # Use Recreate. The entrypoints bind hostPorts on the worker. A second pod
    # cannot start while the old pod holds the ports.
    updateStrategy:
      type: Recreate
    service:
      enabled: true
      type: LoadBalancer
    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
        # The Zyxel router does not forward to the LB IP. Traefik binds
        # directly to rbpi for WAN access.
        hostPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
        hostPort: 443
      gitssh:
        port: 2223
        expose:
          default: true
        exposedPort: 2223
        # Forgejo git-ssh moved from port 22 to port 2223. The apex portfolio
        # now uses port 22. The router forwards 2223 to rbpi:2223 for WAN.
        # Clone URLs use ssh://git@git.0xbf.ch:2223/<owner>/<repo>.git
        hostPort: 2223
      devilssh:
        port: 2222
        expose:
          default: true
        exposedPort: 2222
        # No hostPort. Devil SSH is via LB IP only. Access is via LAN and
        # tailnet. The router does not forward port 2222. Port 2222 stays
        # reserved for the future dev box.
      apexssh:
        port: 22
        expose:
          default: true
        exposedPort: 22
        # The portfolio uses port 22 for ssh 0xbf.ch. Forgejo moved to port 2223.
        # The dev box keeps port 2222. The router forwards port 22 to
        # rbpi:22 for WAN.
        hostPort: 22
    providers:
      kubernetesGateway:
        enabled: true
        # TCPRoute (forgejo git-ssh) is experimental-channel only
        experimentalChannel: true
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: false
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`dashboard.internal`)
        entryPoints:
          - websecure
        middlewares:
          - name: internal-allowlist
        tls:
          secretName: wildcard-internal-tls
    gateway:
      enabled: false
    metrics:
      prometheus:
        enabled: true
        # Use a dedicated metrics Service on port 9100 for Prometheus.
        # The LB Service does not expose metrics.
        service:
          enabled: true
    global:
      checkNewVersion: false
      sendAnonymousUsage: false