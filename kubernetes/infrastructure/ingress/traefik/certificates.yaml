apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-acme
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-acme-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns01
              key: token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-domain
  namespace: ingress
spec:
  secretName: wildcard-domain-tls
  issuerRef:
    name: letsencrypt-acme
    kind: ClusterIssuer
  dnsNames:
    - "0xbf.ch"
    - "*.0xbf.ch"
---
# Let's Encrypt cannot issue for reserved .internal TLD,
# internal certificates come from local CA.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: internal-ca
  duration: 87600h # 10y
  secretName: internal-ca-key
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca-key
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-internal
  namespace: ingress
spec:
  secretName: wildcard-internal-tls
  duration: 8760h # 1y
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
  dnsNames:
    - "*.internal"
---
# Second-level wildcard for PDS account handles (<name>.pds.0xbf.ch) —
# the *.0xbf.ch cert only ever matches one label.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pds-handles-wildcard
  namespace: ingress
spec:
  secretName: pds-handles-wildcard-tls
  issuerRef:
    name: letsencrypt-acme
    kind: ClusterIssuer
  dnsNames:
    - "*.pds.0xbf.ch"
