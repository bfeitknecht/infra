apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-acme
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-acme-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns01
              key: token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-domain
  namespace: ingress
spec:
  secretName: wildcard-domain-tls
  issuerRef:
    name: letsencrypt-acme
    kind: ClusterIssuer
  dnsNames:
    - "0xbf.ch"
    - "*.0xbf.ch"
---
# Let's Encrypt cannot issue for reserved .internal TLD.
# Internal certificates come from local CA.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: internal-ca
  subject:
    organizations: ["0xbf internal"]
  duration: 87600h # 10y
  secretName: internal-ca-key
  # Clients reject any cert from this CA outside .internal. A leaked CA key
  # cannot sign for real domains. Devices trust this CA (owner installs it).
  nameConstraints:
    critical: true
    permitted:
      dnsDomains:
        - internal
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca-key
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-hosts
  namespace: ingress
spec:
  secretName: internal-hosts-tls
  duration: 8760h # 1y
  subject:
    organizations: ["0xbf internal"]
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
  # Explicit names, no wildcard. Clients reject "*.internal": a wildcard
  # directly under a top-level domain is invalid. Add every new *.internal
  # host here (same PR as its HTTPRoute).
  dnsNames:
    - agh.internal
    - dashboard.internal
    - dawarich.internal
    - devil.internal
    - files.internal
    - grafana.internal
    - homepage.internal
    - immich.internal
    - jellyfin.internal
    - opencode.internal
    - prowlarr.internal
    - qbittorrent.internal
    - radarr.internal
    - sonarr.internal
    - status.internal
---
# Second-level wildcard for PDS handles. Pattern is <name>.pds.0xbf.ch.
# The *.0xbf.ch cert matches one label only.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pds-handles-wildcard
  namespace: ingress
spec:
  secretName: pds-handles-wildcard-tls
  issuerRef:
    name: letsencrypt-acme
    kind: ClusterIssuer
  dnsNames:
    - "*.pds.0xbf.ch"
