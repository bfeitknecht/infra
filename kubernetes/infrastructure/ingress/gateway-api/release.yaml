apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/gateway-api
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-api-crds
      version: "v1.2.0"
      sourceRef:
        kind: HelmRepository
        name: gateway-api-crds
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
