apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.cilium.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m

  chart:
    spec:
      chart: cilium
      version: "1.20.2"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 1h

  targetNamespace: kube-system

  values:
    ipam:
      mode: kubernetes

    kubeProxyReplacement: true
    # Socket LB only for host processes. Pods use per-packet service translation.
    # Kata VMs (devil, agent sandboxes) bypass socket hooks: with full socket LB
    # their ClusterIP traffic leaves untranslated and times out.
    socketLB:
      hostNamespaceOnly: true

    gatewayAPI:
      enabled: false

    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true

    # Grafana dashboards that match this Cilium version (ConfigMaps, picked
    # up by the Grafana sidecar in every namespace).
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Cilium

    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Cilium

    hubble:
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop
          - tcp
          - flow
          - icmp
          - http
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: Cilium

    k8sServiceHost: localhost
    k8sServicePort: 7445

    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    securityContext:
      privileged: true
