# Agent Sandbox controller (kubernetes-sigs, SIG Apps) with the extensions
# (SandboxTemplate, SandboxWarmPool, SandboxClaim). Chart and CRDs come from the
# pinned GitRepository agent-sandbox in cluster/crds.yaml. Bump both there.
# Default reconcileStrategy (ChartVersion): Revision adds +<sha> to the chart
# version, and the chart puts it in a label, which the API rejects.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: ./helm
      sourceRef:
        kind: GitRepository
        name: agent-sandbox
        namespace: flux-system
  targetNamespace: agent-sandbox-system
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    namespace:
      create: false
      name: agent-sandbox-system
    image:
      tag: v1.0.11
    controller:
      extensions: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
