apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: teleport
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.releases.teleport.dev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleport
  namespace: teleport
spec:
  interval: 30m
  chart:
    spec:
      chart: teleport-cluster
      version: "18.10.0"
      sourceRef:
        kind: HelmRepository
        name: teleport
        namespace: flux-system
  values:
    chartMode: standalone
    # immutable for the cluster's life — changing it means redeploying
    clusterName: teleport.internal
    kubeClusterName: infra
    # TLS routing: web UI, tsh and agent tunnels multiplex on one 443 that
    # the proxy terminates itself — no Traefik in the path
    proxyListenerMode: multiplex
    authentication:
      type: local
      secondFactors:
        - webauthn
    # the chart only sets storageClassName when given; this cluster has no
    # default StorageClass, so this is load-bearing
    persistence:
      storageClassName: local-path
      volumeSize: 10Gi
    service:
      type: LoadBalancer
      spec:
        # static from the lan-pool like AGH (10.10.20.153); teleport.internal
        # points here via an explicit knot zone record
        loadBalancerIP: 10.10.20.154
    tls:
      existingSecretName: teleport-tls
    podMonitor:
      enabled: true
    podSecurityPolicy:
      enabled: false