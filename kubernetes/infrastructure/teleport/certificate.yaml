apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: teleport
  namespace: teleport
spec:
  secretName: teleport-tls
  duration: 8760h # 1y — same lifecycle as the *.internal wildcard
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
  dnsNames:
    - "teleport.internal"
    # the devil agent joins through the in-cluster Service; the proxy's cert
    # must cover the name it dials
    - "teleport.teleport.svc"
    - "teleport.teleport.svc.cluster.local"