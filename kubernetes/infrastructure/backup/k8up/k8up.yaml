apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8up
  namespace: flux-system
spec:
  interval: 24h
  url: https://k8up-io.github.io/k8up
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: k8up
      version: "4.10.0"
      sourceRef:
        kind: HelmRepository
        name: k8up
        namespace: flux-system
  values:
    k8up:
      # cron schedules fire in this timezone (default UTC)
      timezone: Europe/Zurich
      # global backend defaults: per-namespace Schedules need no backend block
      # and no secret copies (k8up backs up the PVCs of the Schedule's namespace)
      envVars:
        - name: BACKUP_GLOBALS3ENDPOINT
          # in-cluster relay: the NAS is shared-in user-scoped, tagged devices can never reach it directly
          value: http://tailscale-relay.egress.svc.cluster.local:3900
        - name: BACKUP_GLOBALS3BUCKET
          value: k8up
        - name: BACKUP_GLOBALACCESSKEYID
          valueFrom:
            secretKeyRef:
              name: garage-s3-credentials
              key: access-key-id
        - name: BACKUP_GLOBALSECRETACCESSKEY
          valueFrom:
            secretKeyRef:
              name: garage-s3-credentials
              key: secret-access-key
        - name: BACKUP_GLOBALREPOPASSWORD
          valueFrom:
            secretKeyRef:
              name: k8up-password
              key: password
  targetNamespace: k8up
