apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/gatus.db
    ui:
      title: Infra Status
    endpoints:
      - name: grafana
        url: http://monitoring-kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health
        interval: 1m
        conditions: ["[STATUS] == 200"]
      - name: traefik-metrics
        # Metrics use a dedicated Service.
        url: http://ingress-traefik-metrics.ingress.svc.cluster.local:9100/metrics
        interval: 1m
        conditions: ["[STATUS] == 200"]
      - name: gateway-lan
        url: https://10.10.20.128
        interval: 1m
        client:
          insecure: true
        conditions: ["[STATUS] == 404"]
      # kresd ClusterIP (see applications/dns)
      - name: dns-internal
        url: 10.96.0.53
        interval: 1m
        dns:
          query-name: dashboard.internal
          query-type: A
        conditions: ["[DNS_RCODE] == NOERROR", "[BODY] == 10.10.20.128"]
      # kresd on OCI does public recursion.
      - name: dns-public
        url: 10.96.0.53
        interval: 1m
        dns:
          query-name: example.com
          query-type: A
        conditions: ["[DNS_RCODE] == NOERROR"]
      # Edge resolver. AGH forwards to kresd and knotd via LB IP.
      - name: dns-edge
        url: 10.10.20.153
        interval: 1m
        dns:
          query-name: dashboard.internal
          query-type: A
        conditions: ["[DNS_RCODE] == NOERROR", "[BODY] == 10.10.20.128"]
      - name: homepage
        url: http://homepage.homepage.svc.cluster.local
        interval: 1m
        conditions: ["[STATUS] == 200"]
      - name: forgejo
        url: http://forgejo.forgejo.svc.cluster.local/api/healthz
        interval: 1m
        conditions: ["[STATUS] == 200"]
      - name: pds
        url: http://pds-http.pds.svc.cluster.local/xrpc/_health
        interval: 1m
        conditions: ["[STATUS] == 200"]
      - name: apex
        url: http://apex.apex.svc.cluster.local
        interval: 1m
        conditions: ["[STATUS] == 200"]
      # SSH check uses TCP connect. A successful connection shows the
      # listener is active and the host key is present.
      - name: apex-ssh
        url: tcp://apex-tui.apex.svc.cluster.local:2222
        interval: 1m
        conditions: ["[CONNECTED] == true"]
      - name: glob
        url: http://glob.glob.svc.cluster.local
        interval: 1m
        conditions: ["[STATUS] == 200"]
      - name: exhib
        url: http://exhib.exhib.svc.cluster.local
        interval: 1m
        conditions: ["[STATUS] == 200"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus-data
  namespace: monitoring
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.36.0
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: monitoring
  labels:
    app: gatus
spec:
  selector:
    app: gatus
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - status.internal
  rules:
    - backendRefs:
        - name: gatus
          port: 80