# Gatus status page at status.internal. Config: gatus-config.yaml (generated
# ConfigMap: a change rolls the pod). Pinned to rbpi with the rest of monitoring.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus-data
  namespace: monitoring
spec:
  storageClassName: local-path-nvme
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      nodeSelector:
        kubernetes.io/hostname: rbpi
      automountServiceAccountToken: false
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.36.0
          env:
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gatus-secrets
                  key: NTFY_TOKEN
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: monitoring
  labels:
    app: gatus
spec:
  selector:
    app: gatus
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - status.internal
  rules:
    # authentik forward auth callback (sign-in, sign-out) on this host.
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - name: gatus
          port: 80