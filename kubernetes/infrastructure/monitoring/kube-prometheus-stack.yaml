apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.4.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  targetNamespace: monitoring
  install:
    createNamespace: true
  # Flux resource metrics for kube-state-metrics (flux-ksm-values.yaml).
  valuesFrom:
    - kind: ConfigMap
      name: flux-kube-state-metrics
      valuesKey: values.yaml
  # Placement (AGENTS.md "Workload placement"): monitoring lives on rbpi, the
  # always-on node, so it can report a failing rzbl. PVCs on rbpi nvme0.
  values:
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    coreDns:
      enabled: true
    prometheusOperator:
      nodeSelector:
        kubernetes.io/hostname: rbpi
    kube-state-metrics:
      nodeSelector:
        kubernetes.io/hostname: rbpi
    prometheus-node-exporter:
      prometheus:
        monitor:
          # instance = node name (rbpi, rzbl, oci), not IP:port.
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: instance
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: node
    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 15GB
        nodeSelector:
          kubernetes.io/hostname: rbpi
        resources:
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            memory: 3Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        storageSpec:
          disableMountSubPath: true
          volumeClaimTemplate:
            spec:
              storageClassName: local-path-nvme
              resources:
                requests:
                  storage: 20Gi
    alertmanager:
      # Alerts go to ntfy topic alerts (phone). Token file from Secret
      # alertmanager-secrets; ntfy formats the payload (?template=alertmanager).
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: ntfy
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: "null"
              matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
            - receiver: "null"
              matchers: ['severity = "info"']
        inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity = "warning"']
            equal: [namespace, alertname]
        receivers:
          - name: "null"
          - name: ntfy
            webhook_configs:
              - url: http://ntfy.ntfy.svc.cluster.local/alerts?template=alertmanager
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alertmanager-secrets/ntfy-token
      alertmanagerSpec:
        secrets:
          - alertmanager-secrets
        nodeSelector:
          kubernetes.io/hostname: rbpi
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
        storage:
          disableMountSubPath: true
          volumeClaimTemplate:
            spec:
              storageClassName: local-path-nvme
              resources:
                requests:
                  storage: 1Gi
    grafana:
      nodeSelector:
        kubernetes.io/hostname: rbpi
      # The stock kube-prometheus dashboards are many and hard to read. A
      # curated set instead (below), plus the 0xbf home dashboard.
      defaultDashboardsEnabled: false
      admin:
        existingSecret: grafana-credentials
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: local-path-nvme
        size: 2Gi
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      grafana.ini:
        server:
          root_url: https://grafana.internal
        dashboards:
          default_home_dashboard_path: /tmp/dashboards/0xbf/home.json
        auth:
          oauth_auto_login: false
          signout_redirect_url: https://auth.0xbf.ch/application/o/grafana/end-session/
        # authentik SSO: public client with PKCE, no secret. Group developers
        # may log in (authentik binding); authentik Admins become Grafana admins.
        auth.generic_oauth:
          enabled: true
          name: authentik
          allow_sign_up: true
          client_id: grafana
          use_pkce: true
          scopes: openid email profile
          auth_url: https://auth.0xbf.ch/application/o/authorize/
          token_url: https://auth.0xbf.ch/application/o/token/
          api_url: https://auth.0xbf.ch/application/o/userinfo/
          role_attribute_path: contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'
          allow_assign_grafana_admin: true
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: curated
              folder: Cluster
              type: file
              disableDeletion: true
              options:
                path: /var/lib/grafana/dashboards/curated
      # Curated dashboards, pinned by revision (grafana.com) or commit (Flux).
      dashboards:
        curated:
          k8s-global:
            gnetId: 15757
            revision: 43
            datasource: Prometheus
          k8s-namespaces:
            gnetId: 15758
            revision: 46
            datasource: Prometheus
          k8s-nodes:
            gnetId: 15759
            revision: 40
            datasource: Prometheus
          k8s-pods:
            gnetId: 15760
            revision: 41
            datasource: Prometheus
          node-exporter:
            gnetId: 1860
            revision: 46
            datasource: Prometheus
          traefik:
            gnetId: 17346
            revision: 9
            datasource: Prometheus
          gpu:
            gnetId: 14574
            revision: 19
            datasource: Prometheus
          flux-cluster:
            url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/cluster.json
            datasource: Prometheus
          flux-control-plane:
            url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/control-plane.json
            datasource: Prometheus
