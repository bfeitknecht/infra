# Gatus endpoints (status.internal). Groups: public = what visitors see,
# through the real edge (DNS, WAN, Traefik, TLS); internal = services in the
# cluster; platform = DNS, gateway, monitoring; backup = the path to the NAS.
metrics: true
# Push to ntfy (topic alerts) after 3 failed checks, and again when resolved.
# NTFY_TOKEN comes from Secret gatus-secrets (publisher, write-only).
alerting:
  ntfy:
    url: http://ntfy.ntfy.svc.cluster.local
    topic: alerts
    token: ${NTFY_TOKEN}
    priority: 4
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
storage:
  type: sqlite
  path: /data/gatus.db
ui:
  title: 0xbf status
  header: 0xbf status
endpoints:
  - &public
    # ---- public: through the edge, with certificate expiry
    name: apex
    group: public
    url: https://0xbf.ch
    interval: 2m
    conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 240h"]
    alerts: [{type: ntfy}]
  - {!!merge <<: *public, name: blog, url: 'https://blog.0xbf.ch'}
  - {!!merge <<: *public, name: gallery, url: 'https://gallery.0xbf.ch'}
  - {!!merge <<: *public, name: git, url: 'https://git.0xbf.ch/api/healthz'}
  - {!!merge <<: *public, name: pds, url: 'https://pds.0xbf.ch/xrpc/_health'}
  - {!!merge <<: *public, name: atuin, url: 'https://atuin.0xbf.ch/healthz'}
  - {!!merge <<: *public, name: auth, url: 'https://auth.0xbf.ch/-/health/live/'}
  - {!!merge <<: *public, name: stream, url: 'https://stream.0xbf.ch/health'}
  - {!!merge <<: *public, name: notify, url: 'https://notify.0xbf.ch/v1/health'}
  - {!!merge <<: *public, name: photos, url: 'https://photos.0xbf.ch/api/server/ping'}
  # copyparty answers 401/403 without login; any non-5xx is up.
  - name: files
    group: public
    url: https://files.0xbf.ch/
    interval: 2m
    conditions: ["[STATUS] < 500", "[CERTIFICATE_EXPIRATION] > 240h"]
    alerts: [{type: ntfy}]
  # ---- SSH fronts: git on the clean 22, the mux on 2222 (apex). Avoid probing through the mux: it would
  # start real sessions. TCP connects are enough.
  - name: git ssh
    group: public
    url: tcp://git.0xbf.ch:22
    interval: 2m
    conditions: ["[CONNECTED] == true"]
    alerts: [{type: ntfy}]
  - name: sshmux
    group: public
    url: tcp://0xbf.ch:2222
    interval: 2m
    conditions: ["[CONNECTED] == true"]
    alerts: [{type: ntfy}]
  - &internal
    # ---- internal: cluster services
    name: jellyfin
    group: internal
    url: http://jellyfin.media.svc.cluster.local/health
    interval: 1m
    conditions: ["[STATUS] == 200"]
    alerts: [{type: ntfy}]
  - {!!merge <<: *internal, name: sonarr, url: 'http://sonarr.media.svc.cluster.local/ping'}
  - {!!merge <<: *internal, name: radarr, url: 'http://radarr.media.svc.cluster.local/ping'}
  - {!!merge <<: *internal, name: lidarr, url: 'http://lidarr.media.svc.cluster.local/ping'}
  - {!!merge <<: *internal, name: navidrome, url: 'http://navidrome.media.svc.cluster.local/ping'}
  - {!!merge <<: *internal, name: dawarich, url: 'http://dawarich.dawarich.svc.cluster.local/api/v1/health'}
  - name: time machine
    group: internal
    url: tcp://10.10.20.145:445
    interval: 2m
    conditions: ["[CONNECTED] == true"]
    alerts: [{type: ntfy}]
  - {!!merge <<: *internal, name: prowlarr, url: 'http://prowlarr.media.svc.cluster.local/ping'}
  - {!!merge <<: *internal, name: ollama, url: 'http://ollama.ollama.svc.cluster.local:11434/'}
  - {!!merge <<: *internal, name: agh, url: 'http://agh.agh.svc.cluster.local/'}
  - {!!merge <<: *internal, name: immich, url: 'http://immich-server.immich.svc.cluster.local/api/server/ping'}
  # ---- platform
  - name: gateway lan
    group: platform
    url: https://10.10.20.128
    interval: 1m
    client:
      insecure: true
    conditions: ["[STATUS] == 404"]
    alerts: [{type: ntfy}]
  - &dns
    name: dns internal
    group: platform
    url: 10.96.0.53
    interval: 1m
    dns:
      query-name: dashboard.internal
      query-type: A
    conditions: ["[DNS_RCODE] == NOERROR", "[BODY] == 10.10.20.128"]
    alerts: [{type: ntfy}]
  - !!merge <<: *dns
    name: dns public
    dns:
      query-name: example.com
      query-type: A
    conditions: ["[DNS_RCODE] == NOERROR"]
  # Edge resolver: AGH forwards to kresd.
  - {!!merge <<: *dns, name: dns edge, url: 10.10.20.153}
  - {!!merge <<: *internal, name: ntfy, group: platform, url: 'http://ntfy.ntfy.svc.cluster.local/v1/health'}
  - {!!merge <<: *internal, name: grafana, group: platform, url: 'http://monitoring-kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health'}
  - {!!merge <<: *internal, name: prometheus, group: platform, url: 'http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/-/healthy'}
  # ---- backup: Garage on the friend's NAS through the relay. HTTP, not TCP:
  # a TCP connect only reaches socat in the relay pod. Garage answers an
  # anonymous request with 403. Red until it listens on 3900.
  - name: garage via relay
    group: backup
    url: http://tailscale-relay.egress.svc.cluster.local:3900/
    interval: 5m
    conditions: ["[STATUS] == 403"]
