apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - grafana.internal
  rules:
    - backendRefs:
        # namespace-prefixed fullname: the HelmRelease installs as
        # monitoring-kube-prometheus-stack, not kube-prometheus-stack
        - name: monitoring-kube-prometheus-stack-grafana
          port: 80
