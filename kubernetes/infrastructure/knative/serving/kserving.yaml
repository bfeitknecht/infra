# KnativeServing CR. Operator creates CRDs and control plane. Operator
# sets net-gateway-api layer. Change version here to upgrade. Do not
# vendor manifests.
apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
    name: serving
    namespace: knative-serving
spec:
    version: "1.23.0"
    ingress:
        istio:
            enabled: false
    config:
        network:
            # Use net-gateway-api layer. KSvc HTTPRoutes render on Traefik
            # Gateway. No Kourier. No extra LoadBalancer.
            ingress-class: "net-gateway-api"
            domainTemplate: "{{.Name}}.0xbf.ch"
        gateway:
            # Route Knative HTTPRoutes through Traefik Gateway. Wildcard DNS
            # and router forward already carry *.0xbf.ch to it.
            external-gateways: |
                - class: traefik
                  gateway: ingress/traefik-gateway
                  service: ingress/ingress-traefik
