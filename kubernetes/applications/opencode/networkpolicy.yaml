# Network wall for agents. Default deny (any rule present denies the rest).
# Egress: DNS, Ollama, package registries, LLM APIs, GitHub, git.0xbf.ch.
# No home LAN, no tailnet, no other namespaces, no Kubernetes API.
# Ingress: Traefik only (authentik sits in front of the route).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-isolation
  namespace: opencode
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ingress
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "4096"
              protocol: TCP
    # devil attaches its opencode TUI straight to the server
    # (`opencode attach http://opencode.opencode.svc`), without authentik.
    # devil is the owner's VM; nothing else in the cluster gets in.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devil
      toPorts:
        - ports:
            - port: "4096"
              protocol: TCP
  egress:
    # DNS through CoreDNS, with DNS visibility (needed for toFQDNs).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ollama
            app.kubernetes.io/name: ollama
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
    - toFQDNs:
        # opencode itself and its model catalog
        - matchName: registry.npmjs.org
        - matchName: models.dev
        - matchName: opencode.ai
        - matchPattern: "*.opencode.ai"
        # LLM APIs
        - matchName: api.anthropic.com
        - matchName: api.openai.com
        - matchName: openrouter.ai
        - matchName: generativelanguage.googleapis.com
        # Code hosting
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchPattern: "*.githubusercontent.com"
        - matchName: git.0xbf.ch
        # Package registries
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: crates.io
        - matchName: index.crates.io
        - matchName: static.crates.io
        - matchName: proxy.golang.org
        - matchName: sum.golang.org
        - matchName: deb.debian.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: git.0xbf.ch
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
