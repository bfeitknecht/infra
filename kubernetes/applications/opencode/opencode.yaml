# opencode web gives a shell in this pod. It needs OPENCODE_SERVER_PASSWORD
# (HTTP basic auth, user "opencode") and the LAN/tailnet allowlist.
# No official image: the npm package runs on node. HOME is on the PVC, so the
# npx cache, git clones and sessions survive restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode
  labels:
    app.kubernetes.io/name: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode
          image: docker.io/library/node:22-bookworm
          command: ["npx", "-y", "opencode-ai@1.19.5", "web", "--hostname", "0.0.0.0", "--port", "4096"]
          workingDir: /home/node/work
          env:
            - name: HOME
              value: /home/node
            - name: OPENCODE_CONFIG
              value: /etc/opencode/opencode.json
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: OPENCODE_SERVER_PASSWORD
          ports:
            - name: http
              containerPort: 4096
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: config
              mountPath: /etc/opencode
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: opencode-home
        - name: config
          configMap:
            name: opencode-config
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode
spec:
  selector:
    app.kubernetes.io/name: opencode
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode
  namespace: opencode
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - opencode.internal
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: opencode
          port: 80
