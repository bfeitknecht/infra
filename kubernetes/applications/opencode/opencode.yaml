# opencode web gives agents a shell. Isolation (AGENTS.md, opencode):
# Kata VM (own kernel), CiliumNetworkPolicy (egress allowlist, ingress from
# Traefik and devil), authentik forward auth (group developers), no SA token.
# Image: images/opencode (opencode + the opencode-sandbox plugin; every bash
# command runs in bubblewrap). HOME is on the PVC, so git clones and sessions
# survive restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode
  labels:
    app.kubernetes.io/name: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      runtimeClassName: kata-qemu
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode
          # In-tree image (images/opencode): opencode + the opencode-sandbox
          # plugin. The pin must match the release tag (`just release`
          # checks). omni devil.nix wraps the same opencode version for `oc`.
          image: ghcr.io/bfeitknecht/opencode:v1.59.0
          imagePullPolicy: IfNotPresent
          workingDir: /home/node/work
          env:
            - name: HOME
              value: /home/node
            - name: OPENCODE_CONFIG
              value: /etc/opencode/opencode.json
            # Every bash command: bubblewrap, enforce mode. Reads: the secret
            # paths and opencode's own state (API keys) are denied. Network:
            # domain allowlist through the sandbox proxy. Writes: the project
            # directory and /tmp only. An env var, so no file the agent can
            # write changes it.
            - name: OPENCODE_SANDBOX_CONFIG
              value: '{"mode":"enforce","filesystem":{"denyRead":["/home/node/.ssh","/home/node/.gnupg","/home/node/.aws/credentials","/home/node/.azure","/home/node/.config/gcloud","/home/node/.config/gh","/home/node/.kube","/home/node/.docker/config.json","/home/node/.npmrc","/home/node/.netrc","/home/node/.env","/home/node/.local/share/opencode","/home/node/.config/opencode"]},"network":{"allowedDomains":["registry.npmjs.org","*.npmjs.org","registry.yarnpkg.com","pypi.org","*.pypi.org","files.pythonhosted.org","crates.io","*.crates.io","proxy.golang.org","sum.golang.org","github.com","*.github.com","codeload.github.com","*.githubusercontent.com","git.0xbf.ch"]}}'
            # Git as the Forgejo bot `opencode` over HTTPS (the sandbox proxy
            # carries HTTPS, not SSH). Token in opencode-secrets; push rights
            # only as collaborator on bf/* repos. ssh-style URLs are rewritten.
            - name: GIT_CONFIG_COUNT
              value: "3"
            # Read-only helper: answers `get` from the mounted file and never
            # writes back (the store helper fails on the read-only mount).
            - name: GIT_CONFIG_KEY_0
              value: credential.https://git.0xbf.ch.helper
            - name: GIT_CONFIG_VALUE_0
              value: >-
                !f() { [ "$1" = get ] || exit 0; printf 'username=opencode\npassword=%s\n' "$(sed -E 's#^https://[^:]+:([^@]+)@.*#\1#' /etc/opencode-git/git-credentials)"; }; f
            - name: GIT_CONFIG_KEY_1
              value: url.https://git.0xbf.ch/.insteadOf
            - name: GIT_CONFIG_VALUE_1
              value: "git@git.0xbf.ch:"
            - name: GIT_CONFIG_KEY_2
              value: url.https://git.0xbf.ch/.insteadOf
            - name: GIT_CONFIG_VALUE_2
              value: ssh://git@git.0xbf.ch/
            - name: GIT_AUTHOR_NAME
              value: opencode
            - name: GIT_AUTHOR_EMAIL
              value: noreply+opencode@0xbf.ch
            - name: GIT_COMMITTER_NAME
              value: opencode
            - name: GIT_COMMITTER_EMAIL
              value: noreply+opencode@0xbf.ch
          ports:
            - name: http
              containerPort: 4096
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: config
              mountPath: /etc/opencode
              readOnly: true
            - name: git
              mountPath: /etc/opencode-git
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: opencode-data
        - name: config
          configMap:
            name: opencode-config
        - name: git
          secret:
            secretName: opencode-secrets
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode
spec:
  selector:
    app.kubernetes.io/name: opencode
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode
  namespace: opencode
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - opencode.internal
  rules:
    # authentik forward auth callback (sign-in, sign-out) on this host.
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - name: opencode
          port: 80
