# opencode web gives agents a shell. Isolation (docs/AGENT_ISOLATION.md):
# Kata VM (own kernel), CiliumNetworkPolicy (egress allowlist, ingress from
# Traefik and devil), authentik forward auth (group developers), no SA token.
# No official image: the npm package runs on node. HOME is on the PVC, so the
# npx cache, git clones and sessions survive restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode
  labels:
    app.kubernetes.io/name: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      runtimeClassName: kata-qemu
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode
          image: docker.io/library/node:22-bookworm
          # The Forgejo bot key (opencode-secrets) is copied to a private file
          # first: ssh refuses a key that others can read. Version pin: omni
          # devil.nix wraps the same version for `oc` (bump both together).
          command:
            - sh
            - -c
            - >-
              install -d -m 700 /home/node/.ssh && install -m 600 /etc/opencode-git/id_ed25519 /home/node/.ssh/forgejo-bot && exec npx -y opencode-ai@1.19.5 web --hostname 0.0.0.0 --port 4096
          workingDir: /home/node/work
          env:
            - name: HOME
              value: /home/node
            - name: OPENCODE_CONFIG
              value: /etc/opencode/opencode.json
            # Git as the Forgejo bot `opencode`: SSH on git.0xbf.ch:22 with the
            # pinned host key. Push rights come from collaborator access per
            # repo on Forgejo, never from the owner's keys.
            - name: GIT_SSH_COMMAND
              value: ssh -i /home/node/.ssh/forgejo-bot -o IdentitiesOnly=yes -o UserKnownHostsFile=/etc/opencode-git/known_hosts
            - name: GIT_AUTHOR_NAME
              value: opencode
            - name: GIT_AUTHOR_EMAIL
              value: noreply+opencode@0xbf.ch
            - name: GIT_COMMITTER_NAME
              value: opencode
            - name: GIT_COMMITTER_EMAIL
              value: noreply+opencode@0xbf.ch
          ports:
            - name: http
              containerPort: 4096
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: config
              mountPath: /etc/opencode
              readOnly: true
            - name: git
              mountPath: /etc/opencode-git
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: opencode-data
        - name: config
          configMap:
            name: opencode-config
        - name: git
          secret:
            secretName: opencode-secrets
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode
spec:
  selector:
    app.kubernetes.io/name: opencode
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode
  namespace: opencode
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - opencode.internal
  rules:
    # authentik forward auth callback (sign-in, sign-out) on this host.
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - name: opencode
          port: 80
