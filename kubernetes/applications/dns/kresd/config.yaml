workers: 1
logging:
  level: info
network:
  listen:
    - interface: eth0@53
forward:
  # internal. has no public DNS. DNSSEC would reject it as spoof.
  # Use authoritative stub to knotd on loopback instead.
  - subtree: internal
    servers: [ 127.0.0.1 ]
    options:
      authoritative: true
      dnssec: false
