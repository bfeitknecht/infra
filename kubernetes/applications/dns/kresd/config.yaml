workers: 1
logging:
  level: info
network:
  listen:
    - interface: eth0@53
forward:
  # internal. Is a reserved TLD with no public DNS; DNSSEC validation would
  # reject it as indistinguishable from spoofing, so it is grafted via an
  # authoritative stub instead (per Knot Resolver docs, "fake top-level
  # domains"). Knotd runs in the same pod and answers on loopback.
  - subtree: internal
    servers: [ 127.0.0.1 ]
    options:
      authoritative: true
      dnssec: false