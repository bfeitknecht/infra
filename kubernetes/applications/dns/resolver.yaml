apiVersion: apps/v1
kind: Deployment
metadata:
  name: resolver
  namespace: dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resolver
  template:
    metadata:
      labels:
        app: resolver
    spec:
      # Only workload on control plane. DNS needs clean egress on port 53.
      # Home router hijacks DNS. Taint stays.
      nodeSelector:
        kubernetes.io/hostname: oci
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        # Kresd does public recursion. It validates DNSSEC. It stubs
        # internal to knotd on loopback.
        - name: kresd
          image: docker.io/cznic/knot-resolver:v6.4.2
          args: ["-c", "/kresd-config/config.yaml"]
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
          volumeMounts:
            - name: kresd-config
              mountPath: /kresd-config
              readOnly: true
            - name: kresd-cache
              mountPath: /var/cache/knot-resolver
          resources:
            requests:
              cpu: 32m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 15
            periodSeconds: 30
        # Knotd is authority for internal. zone. Kresd reaches it on
        # loopback. No other client reaches it.
        - name: knotd
          image: docker.io/cznic/knot:v3.6.0
          command: ["knotd", "-c", "/knot-config/knot.conf"]
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
          volumeMounts:
            - name: knot-config
              mountPath: /knot-config
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["knotc", "status"]
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: kresd-config
          configMap:
            name: kresd-config
        - name: knot-config
          configMap:
            name: knot-config
        - name: kresd-cache
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: resolver
  namespace: dns
spec:
  type: ClusterIP
  # Pinned IP. AGH forwards all queries here. This address is stable.
  clusterIP: 10.96.0.53
  selector:
    app: resolver
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
