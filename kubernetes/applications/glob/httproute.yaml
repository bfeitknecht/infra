apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glob
  namespace: glob
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - blg.0xbf.ch
  rules:
    - backendRefs:
        - name: glob
          port: 80
---
# The old hostname, kept for links and feed readers: 301 to the same path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glob-redirect
  namespace: glob
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - blog.0xbf.ch
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: blg.0xbf.ch
            statusCode: 301
