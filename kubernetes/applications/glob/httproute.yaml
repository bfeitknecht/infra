apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: glob
    namespace: glob
spec:
    parentRefs:
        - name: traefik-gateway
          namespace: ingress
          sectionName: websecure
    hostnames:
        - blog.0xbf.ch
    rules:
        - backendRefs:
            - name: glob
              port: 80
