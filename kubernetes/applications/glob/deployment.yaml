apiVersion: apps/v1
kind: Deployment
metadata:
    name: glob
    namespace: glob
    labels:
        app.kubernetes.io/name: glob
    # Keel reads keel.sh/* from Deployment metadata. Do not use pod template metadata.
    annotations:
        keel.sh/trigger: poll
        keel.sh/policy: force
        keel.sh/match-tag: "true"
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: glob
    template:
        metadata:
            labels:
                app.kubernetes.io/name: glob
        spec:
            # Keel reads imagePullSecrets from the pod template.
            imagePullSecrets:
                - name: dockerconfigjson
            containers:
                - name: glob
                  # Use :latest. Keel tracks the image digest.
                  image: ghcr.io/bfeitknecht/glob:latest
                  imagePullPolicy: Always
                  ports:
                    - containerPort: 8080
                      name: http
                  readinessProbe:
                    httpGet:
                      path: /
                      port: http
                    initialDelaySeconds: 1
                    periodSeconds: 10
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      memory: 128Mi
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 1000
                    runAsGroup: 1000
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
