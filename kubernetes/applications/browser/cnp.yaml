# The browser pod fetches web pages for the SSH TUI and nothing else. Egress: DNS for
# name resolution and 80/443 for the fetched pages. No direct-service
# ports, no API access (no SA token either).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: browser-egress
  namespace: browser
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
