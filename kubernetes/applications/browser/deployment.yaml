apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser
  namespace: browser
  labels:
    app.kubernetes.io/name: browser
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browser
    spec:
      # amd64 only: the browsh base image bundles x64 Firefox.
      nodeSelector:
        kubernetes.io/hostname: rzbl
      # No Kubernetes API use.
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: browser
          # In-tree image (images/browser). The infra tag vX.Y.Z publishes
          # it with the same tag; this pin must match the release tag
          # (`just release` checks). sshd (22) is mux-only: the sshmux
          # ForceCommands in with its key.
          image: ghcr.io/bfeitknecht/browser:v1.44.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 22
          resources:
            # One session Firefox at most (browser-session holds a lock).
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1.5Gi
          readinessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 60
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: sshd-config
              mountPath: /etc/ssh/sshd_config.d
              readOnly: true
            - name: ssh-keys
              mountPath: /etc/ssh/keys
              readOnly: true
            - name: ssh-authorized
              mountPath: /etc/ssh/mux_authorized_keys
              subPath: authorized_keys
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: sshd-config
          configMap:
            name: browser-sshd
        - name: ssh-keys
          secret:
            secretName: browser-ssh-keys
            defaultMode: 0400
        - name: ssh-authorized
          secret:
            secretName: browser-ssh-keys
            items:
              - key: authorized_keys
                path: authorized_keys
                mode: 0444
