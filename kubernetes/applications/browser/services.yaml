# The mux-only SSH front (22). It never touches the Gateway; the sshmux
# chains into it over the cluster network.
apiVersion: v1
kind: Service
metadata:
  name: browser-ssh
  namespace: browser
  labels:
    app.kubernetes.io/name: browser
spec:
  selector:
    app.kubernetes.io/name: browser
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
