# The browsh web fronts. HTML mode at browser.0xbf.ch; PLAIN mode at
# text.browser.0xbf.ch (the host contains "text.", browsh switches by
# itself). The LE wildcard and the ddns wildcard already cover both names.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser
  namespace: browser
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - browser.0xbf.ch
    - text.browser.0xbf.ch
  rules:
    - backendRefs:
        - name: browser-web
          port: 80
