# Proof-of-work gate in front of the CV. A browser passes after a short
# check (cookie for 7 days); scrapers without a JavaScript engine do not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-anubis
  namespace: apex
  labels:
    app.kubernetes.io/name: apex-anubis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apex-anubis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apex-anubis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.2
          env:
            - name: BIND
              value: ":8923"
            - name: METRICS_BIND
              value: ":9090"
            - name: TARGET
              value: http://apex.apex.svc.cluster.local
            - name: POLICY_FNAME
              value: /etc/anubis/policy.yaml
            - name: COOKIE_DOMAIN
              value: 0xbf.ch
            - name: SERVE_ROBOTS_TXT
              value: "false"
          ports:
            - name: http
              containerPort: 8923
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: policy
              mountPath: /etc/anubis
              readOnly: true
        # Serves the monochrome stylesheet at the exact path of Anubis' own
        # (the route sends only that path here). Anubis' CSS options are
        # enterprise-only; this keeps the stock image.
        - name: style
          image: docker.io/joseluisq/static-web-server:2.44.1-alpine
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_ROOT
              value: /srv
            - name: SERVER_CACHE_CONTROL_HEADERS
              value: "false"
            # The path starts with `.within.website`; the volume holds only
            # this stylesheet.
            - name: SERVER_IGNORE_HIDDEN_FILES
              value: "false"
          ports:
            - name: style
              containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: style
              mountPath: /srv
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: apex-anubis-config
        - name: style
          configMap:
            name: apex-anubis-config
            items:
              - key: style.css
                path: .within.website/x/xess/xess.min.css
---
apiVersion: v1
kind: Service
metadata:
  name: apex-anubis
  namespace: apex
spec:
  selector:
    app.kubernetes.io/name: apex-anubis
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: style
      port: 8080
      targetPort: style
