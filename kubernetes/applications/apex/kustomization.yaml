apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - anubis.yaml
  # SSH portfolio uses a separate Deployment. A broken host key or a
  # crashed session does not affect the static site.
  - tui-deployment.yaml
  - tui-service.yaml
  - apex-ssh-host-key.sops.yaml
configMapGenerator:
  - name: apex-anubis-config
    namespace: apex
    files:
      - policy.yaml=anubis-policy.yaml
      - style.css=anubis-style.css
