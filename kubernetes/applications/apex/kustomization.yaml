apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - deployment.yaml
    - service.yaml
    - httproute.yaml
    - serviceaccount.yaml
    - ghcr.sops.yaml
    # SSH portfolio: own Deployment so broken host key
    # or crashed session loop can never take the static site down.
    - tui-deployment.yaml
    - tui-service.yaml
    - tui-tcproute.yaml
    - ssh-host-key.sops.yaml
