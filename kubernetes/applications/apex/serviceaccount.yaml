# The namespace's default ServiceAccount carries the GHCR pull Secret, so the
# apex Deployment pulls the private ghcr.io/bfeitknecht/apex image without
# per-pod config. Keel's registry poll uses the same credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: default
    namespace: apex
imagePullSecrets:
    - name: dockerconfigjson
