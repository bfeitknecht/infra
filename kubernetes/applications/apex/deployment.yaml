apiVersion: apps/v1
kind: Deployment
metadata:
    name: apex
    namespace: apex
    labels:
        app.kubernetes.io/name: apex
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: apex
    template:
        metadata:
            labels:
                app.kubernetes.io/name: apex
            annotations:
                keel.sh/trigger: poll
                keel.sh/policy: force
                keel.sh/match-tag: "true"
        spec:
            # Keel reads the workload's own imagePullSecrets to query the private GHCR package —
            # the namespace default SA's secret is not enough (Keel resolves credentials from the pod template only).
            imagePullSecrets:
                - name: dockerconfigjson
            containers:
                - name: apex
                  # Hardcoded :latest on purpose — Keel follows the digest.
                  image: ghcr.io/bfeitknecht/apex:latest
                  imagePullPolicy: Always
                  ports:
                    - containerPort: 8080
                      name: http
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      memory: 128Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
