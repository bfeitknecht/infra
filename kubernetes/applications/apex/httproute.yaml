apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: apex
    namespace: apex
spec:
    parentRefs:
        - name: traefik-gateway
          namespace: ingress
          sectionName: websecure
    hostnames:
        - 0xbf.ch
    rules:
        - backendRefs:
            - name: apex
              port: 80
