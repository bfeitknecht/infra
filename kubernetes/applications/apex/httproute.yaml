apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apex
  namespace: apex
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - 0xbf.ch
  rules:
    # Anubis' stylesheet, replaced by a plain monochrome one (sidecar).
    - matches:
        - path:
            type: Exact
            value: /.within.website/x/xess/xess.min.css
      backendRefs:
        - name: apex-anubis
          port: 8080
    # The CV goes through Anubis (proof of work against scrapers). Its
    # challenge assets live under /.within.website/.
    - matches:
        - path:
            type: Exact
            value: /cv
        - path:
            type: Exact
            value: /cv.pdf
        - path:
            type: PathPrefix
            value: /.within.website/
      backendRefs:
        - name: apex-anubis
          port: 80
    - backendRefs:
        - name: apex
          port: 80
