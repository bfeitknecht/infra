apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.4.0
          env:
            # homepage validates the Host header against this list;
            # the second entry is the in-cluster FQDN gatus probes for the status page.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.internal,homepage.homepage.svc.cluster.local
          ports:
            - containerPort: 3000
              name: http
          # Each file mounted individually, subPath mount into the ConfigMap-mounted
          # /app/config dir fails container creation with ENOTDIR (verified 2026-09-21).
          volumeMounts:
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: services
              mountPath: /app/config/services.yaml
              subPath: services.yaml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            # Host header required: homepage rejects requests whose Host is not in
            # HOMEPAGE_ALLOWED_HOSTS (the kubelet probe defaults to the pod IP).
            httpGet:
              path: /
              port: 3000
              httpHeaders:
                - name: Host
                  value: homepage.internal
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              httpHeaders:
                - name: Host
                  value: homepage.internal
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: services
          secret:
            secretName: homepage-services
