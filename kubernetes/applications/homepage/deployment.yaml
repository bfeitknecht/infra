apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.4.0
          env:
            # Homepage checks Host header. Second entry is in-cluster FQDN
            # that gatus uses for probe.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.internal,homepage.homepage.svc.cluster.local
          ports:
            - containerPort: 3000
              name: http
          # Mount each file with subPath. Mounting whole ConfigMap to
          # /app/config fails with ENOTDIR. Verified 2026-09-21.
          volumeMounts:
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: services
              mountPath: /app/config/services.yaml
              subPath: services.yaml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            # Homepage requires Host header. Kubelet probe uses pod IP.
            # Set Host to homepage.internal.
            httpGet:
              path: /
              port: 3000
              httpHeaders:
                - name: Host
                  value: homepage.internal
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              httpHeaders:
                - name: Host
                  value: homepage.internal
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: services
          secret:
            secretName: homepage-services
