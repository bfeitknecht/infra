apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - middleware.yaml
  - httproute.yaml
  - homepage-services.sops.yaml
configMapGenerator:
  - name: homepage-config
    files:
      - settings.yaml
      - kubernetes.yaml
