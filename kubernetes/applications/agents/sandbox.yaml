# One throwaway opencode per task (docs/AGENT_ISOLATION.md step 4).
# Same walls as opencode: Kata VM, CiliumNetworkPolicy agent-isolation, no SA
# token. No PVC: HOME is an emptyDir, a sandbox ends with its claim.
# Take one: a SandboxClaim with warmPoolRef.name: opencode in ns agents.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: opencode
  namespace: agents
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: opencode-sandbox
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      runtimeClassName: kata-qemu
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode
          image: docker.io/library/node:22-bookworm
          command: ["npx", "-y", "opencode-ai@1.19.5", "web", "--hostname", "0.0.0.0", "--port", "4096"]
          workingDir: /home/node
          env:
            - name: HOME
              value: /home/node
            - name: OPENCODE_CONFIG
              value: /etc/opencode/opencode.json
          ports:
            - name: http
              containerPort: 4096
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: config
              mountPath: /etc/opencode
              readOnly: true
      volumes:
        - name: home
          emptyDir:
            sizeLimit: 10Gi
        - name: config
          configMap:
            name: agents-config
---
# One started VM hides the Kata boot and the npx download. Each sandbox is a VM
# (~0.5-4 GiB on rzbl). Raise replicas only with RAM headroom.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: opencode
  namespace: agents
spec:
  replicas: 1
  sandboxTemplateRef:
    name: opencode
