# Git-owned authentik config. The worker applies files from this ConfigMap
# (mounted at /blueprints/mounted/cm-authentik-blueprints) and re-applies on change.
# Add one blueprint per app (OIDC provider + application) here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  base.yaml: |
    version: 1
    metadata:
      name: 0xbf base
    entries:
      # Access groups. App bindings check these groups.
      - model: authentik_core.group
        identifiers:
          name: family
      - model: authentik_core.group
        identifiers:
          name: friends
      # People who may use the git forge.
      - model: authentik_core.group
        identifiers:
          name: developers
  # Upstream example/flows-invitation-enrollment-minimal.yaml (2026.8.5) with our
  # values in place of !Context: flow slug "invite", internal users. Copied, not
  # nested: a nested BlueprintInstance timed out in the worker.
  # Use: Directory > Invitations > Create, flow "invite".
  invitation.yaml: |
    # Minimal Invitation-based Enrollment Blueprint
    #
    # Companion to flows-invitation-enrollment.yaml, intended for the "New Invitation"
    # wizard in the admin UI. Creates a single enrollment flow with an invitation stage
    # bound to it, plus the supporting prompt/user-write/user-login stages.
    #
    # All user-facing fields are parameterized via !Context with fallback defaults, so
    # this blueprint can be imported directly (without context) or through the wizard
    # with custom values.
    #
    # Context keys (all optional):
    #   flow_name                        Display name of the enrollment flow.
    #   flow_slug                        URL slug of the flow and suffix for sub-entity
    #                                    identifiers (so repeated imports with different
    #                                    slugs don't overwrite each other).
    #   stage_name                       Name of the invitation stage.
    #   continue_flow_without_invitation Whether the flow continues when no invitation
    #                                    is supplied (default: false).
    #   user_type                        "external" or "internal" (default: "external").
    #                                    Drives the user-write stage's user_type and
    #                                    user_path_template.
    version: 1
    metadata:
      labels:
        blueprints.goauthentik.io/instantiate: "true"
      name: 0xbf invitation enrollment
    entries:
      - identifiers:
          slug: invite
        model: authentik_flows.flow
        id: flow
        attrs:
          name: "Join 0xbf.ch"
          title: "Join 0xbf.ch"
          designation: enrollment
          authentication: require_unauthenticated

      - identifiers:
          name: invite-stage
        id: invitation-stage
        model: authentik_stages_invitation.invitationstage
        attrs:
          continue_flow_without_invitation: false

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-field-username-%s",
              invite,
            ]
        id: prompt-field-username
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: username
          label: Username
          type: username
          required: true
          placeholder: Username
          placeholder_expression: false
          order: 0

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-field-password-%s",
              invite,
            ]
        id: prompt-field-password
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          placeholder_expression: false
          order: 1

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-field-password-repeat-%s",
              invite,
            ]
        id: prompt-field-password-repeat
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          placeholder_expression: false
          order: 2

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-field-name-%s",
              invite,
            ]
        id: prompt-field-name
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: name
          label: Name
          type: text
          required: true
          placeholder: Name
          placeholder_expression: false
          order: 0

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-field-email-%s",
              invite,
            ]
        id: prompt-field-email
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: email
          label: Email
          type: email
          required: true
          placeholder: Email
          placeholder_expression: false
          order: 1

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-prompt-credentials-%s",
              invite,
            ]
        id: prompt-stage-credentials
        model: authentik_stages_prompt.promptstage
        attrs:
          fields:
            - !KeyOf prompt-field-username
            - !KeyOf prompt-field-password
            - !KeyOf prompt-field-password-repeat

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-prompt-details-%s",
              invite,
            ]
        id: prompt-stage-details
        model: authentik_stages_prompt.promptstage
        attrs:
          fields:
            - !KeyOf prompt-field-name
            - !KeyOf prompt-field-email

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-user-write-%s",
              invite,
            ]
        id: user-write-stage
        model: authentik_stages_user_write.userwritestage
        attrs:
          user_creation_mode: always_create
          user_type: internal
          user_path_template:
            !Format ["users/%s", internal]

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-user-login-%s",
              invite,
            ]
        id: user-login-stage
        model: authentik_stages_user_login.userloginstage

      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf invitation-stage
          order: 5
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true

      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf prompt-stage-credentials
          order: 10
        model: authentik_flows.flowstagebinding

      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf prompt-stage-details
          order: 15
        model: authentik_flows.flowstagebinding

      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf user-write-stage
          order: 20
        model: authentik_flows.flowstagebinding

      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf user-login-stage
          order: 100
        model: authentik_flows.flowstagebinding
  forgejo.yaml: |
    # OIDC for Forgejo. client_secret is generated by authentik: copy it from
    # Admin > Providers > forgejo into the Forgejo admin UI (no sops needed).
    version: 1
    metadata:
      name: 0xbf app forgejo
    entries:
      # Groups again here (idempotent), so this file does not depend on base.yaml order.
      - model: authentik_core.group
        id: group-developers
        identifiers:
          name: developers
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: forgejo
        attrs:
          client_type: confidential
          # Required: the per-provider allowlist defaults to empty in blueprints,
          # and authentik then rejects every flow ("Invalid grant_type").
          grant_types: [authorization_code, refresh_token]
          client_id: forgejo
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://git.0xbf.ch/user/oauth2/authentik/callback
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: forgejo
        attrs:
          name: Forgejo
          provider: !KeyOf provider
          meta_launch_url: https://git.0xbf.ch
      # Only these groups may log in.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-developers
        attrs:
          order: 0
  jellyfin.yaml: |
    # OIDC for Jellyfin. client_secret is generated by authentik: copy it from
    # Admin > Providers > jellyfin into the Jellyfin admin UI (no sops needed).
    version: 1
    metadata:
      name: 0xbf app jellyfin
    entries:
      # Groups again here (idempotent), so this file does not depend on base.yaml order.
      - model: authentik_core.group
        id: group-family
        identifiers:
          name: family
      - model: authentik_core.group
        id: group-friends
        identifiers:
          name: friends
      - model: authentik_core.group
        id: group-developers
        identifiers:
          name: developers
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: jellyfin
        attrs:
          client_type: confidential
          # Required: the per-provider allowlist defaults to empty in blueprints,
          # and authentik then rejects every flow ("Invalid grant_type").
          grant_types: [authorization_code, refresh_token]
          client_id: jellyfin
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://stream.0xbf.ch/sso/OID/redirect/authentik
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: jellyfin
        attrs:
          name: Jellyfin
          provider: !KeyOf provider
          meta_launch_url: https://stream.0xbf.ch
      # Only these groups may log in.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-family
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-friends
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-developers
        attrs:
          order: 2
  grafana.yaml: |
    # Grafana at grafana.internal (group developers). Public client with PKCE:
    # Grafana holds no secret. authentik Admins get the Grafana Admin role
    # (role_attribute_path in kube-prometheus-stack.yaml).
    version: 1
    metadata:
      name: 0xbf app grafana
    entries:
      - model: authentik_core.group
        id: group-developers
        identifiers:
          name: developers
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: grafana
        attrs:
          client_type: public
          # Required in blueprints (empty = every login rejected).
          grant_types: [authorization_code, refresh_token]
          client_id: grafana
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.internal/login/generic_oauth
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf provider
          meta_launch_url: https://grafana.internal
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-developers
        attrs:
          order: 0
  opencode.yaml: |
    # Forward auth (single app) for opencode.internal, group developers.
    # Internal only. The embedded outpost serves it. Add later forward-auth
    # providers to the same outpost list here.
    version: 1
    metadata:
      name: 0xbf app opencode
    entries:
      - model: authentik_core.group
        id: group-developers
        identifiers:
          name: developers
      - model: authentik_providers_proxy.proxyprovider
        id: provider
        identifiers:
          name: opencode
        attrs:
          mode: forward_single
          external_host: https://opencode.internal
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          access_token_validity: hours=24
      - model: authentik_core.application
        id: app
        identifiers:
          slug: opencode
        attrs:
          name: opencode
          provider: !KeyOf provider
          meta_launch_url: https://opencode.internal
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-developers
        attrs:
          order: 0
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf provider
      # agent.0xbf.ch was public for a few hours on 2026-11-17. Removed: opencode
      # stays internal. These entries delete the objects; drop them later.
      - model: authentik_core.application
        state: absent
        identifiers:
          slug: agent
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: agent
