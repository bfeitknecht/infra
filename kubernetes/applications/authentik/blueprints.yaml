# Git-owned authentik config. The worker applies files from this ConfigMap
# (mounted at /blueprints/mounted/cm-authentik-blueprints) and re-applies on change.
# Add one blueprint per app (OIDC provider + application) here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  base.yaml: |
    version: 1
    metadata:
      name: 0xbf base
    entries:
      # Access groups. App bindings check these groups.
      - model: authentik_core.group
        identifiers:
          name: family
      - model: authentik_core.group
        identifiers:
          name: friends
      # People who may use the git forge.
      - model: authentik_core.group
        identifiers:
          name: developers
  # Upstream example/flows-invitation-enrollment-minimal.yaml (2026.8.5) with our
  # values in place of !Context: flow slug "invite", internal users. Copied, not
  # nested: a nested BlueprintInstance timed out in the worker.
  # Use: Directory > Invitations > Create, flow "invite".
  invitation.yaml: |
    # Minimal Invitation-based Enrollment Blueprint
    #
    # Companion to flows-invitation-enrollment.yaml, intended for the "New Invitation"
    # wizard in the admin UI. Creates a single enrollment flow with an invitation stage
    # bound to it, plus the supporting prompt/user-write/user-login stages.
    #
    # All user-facing fields are parameterized via !Context with fallback defaults, so
    # this blueprint can be imported directly (without context) or through the wizard
    # with custom values.
    #
    # Context keys (all optional):
    #   flow_name                        Display name of the enrollment flow.
    #   flow_slug                        URL slug of the flow and suffix for sub-entity
    #                                    identifiers (so repeated imports with different
    #                                    slugs don't overwrite each other).
    #   stage_name                       Name of the invitation stage.
    #   continue_flow_without_invitation Whether the flow continues when no invitation
    #                                    is supplied (default: false).
    #   user_type                        "external" or "internal" (default: "external").
    #                                    Drives the user-write stage's user_type and
    #                                    user_path_template.
    version: 1
    metadata:
      labels:
        blueprints.goauthentik.io/instantiate: "true"
      name: 0xbf invitation enrollment
    entries:
      - identifiers:
          slug: invite
        model: authentik_flows.flow
        id: flow
        attrs:
          name: "Join 0xbf.ch"
          title: "Join 0xbf.ch"
          designation: enrollment
          authentication: require_unauthenticated

      - identifiers:
          name: invite-stage
        id: invitation-stage
        model: authentik_stages_invitation.invitationstage
        attrs:
          continue_flow_without_invitation: false

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-field-username-%s",
              invite,
            ]
        id: prompt-field-username
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: username
          label: Username
          type: username
          required: true
          placeholder: Username
          placeholder_expression: false
          order: 0

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-field-password-%s",
              invite,
            ]
        id: prompt-field-password
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          placeholder_expression: false
          order: 1

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-field-password-repeat-%s",
              invite,
            ]
        id: prompt-field-password-repeat
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          placeholder_expression: false
          order: 2

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-field-name-%s",
              invite,
            ]
        id: prompt-field-name
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: name
          label: Name
          type: text
          required: true
          placeholder: Name
          placeholder_expression: false
          order: 0

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-field-email-%s",
              invite,
            ]
        id: prompt-field-email
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: email
          label: Email
          type: email
          required: true
          placeholder: Email
          placeholder_expression: false
          order: 1

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-prompt-credentials-%s",
              invite,
            ]
        id: prompt-stage-credentials
        model: authentik_stages_prompt.promptstage
        attrs:
          fields:
            - !KeyOf prompt-field-username
            - !KeyOf prompt-field-password
            - !KeyOf prompt-field-password-repeat

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-prompt-details-%s",
              invite,
            ]
        id: prompt-stage-details
        model: authentik_stages_prompt.promptstage
        attrs:
          fields:
            - !KeyOf prompt-field-name
            - !KeyOf prompt-field-email

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-user-write-%s",
              invite,
            ]
        id: user-write-stage
        model: authentik_stages_user_write.userwritestage
        attrs:
          user_creation_mode: always_create
          user_type: internal
          user_path_template:
            !Format ["users/%s", internal]

      - identifiers:
          name:
            !Format [
              "invitation-enrollment-user-login-%s",
              invite,
            ]
        id: user-login-stage
        model: authentik_stages_user_login.userloginstage

      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf invitation-stage
          order: 5
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true

      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf prompt-stage-credentials
          order: 10
        model: authentik_flows.flowstagebinding

      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf prompt-stage-details
          order: 15
        model: authentik_flows.flowstagebinding

      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf user-write-stage
          order: 20
        model: authentik_flows.flowstagebinding

      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf user-login-stage
          order: 100
        model: authentik_flows.flowstagebinding
  forgejo.yaml: |
    # OIDC for Forgejo. client_secret is generated by authentik: copy it from
    # Admin > Providers > forgejo into the Forgejo admin UI (no sops needed).
    version: 1
    metadata:
      name: 0xbf app forgejo
    entries:
      # Groups again here (idempotent), so this file does not depend on base.yaml order.
      - model: authentik_core.group
        id: group-developers
        identifiers:
          name: developers
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: forgejo
        attrs:
          client_type: confidential
          # Required: the per-provider allowlist defaults to empty in blueprints,
          # and authentik then rejects every flow ("Invalid grant_type").
          grant_types: [authorization_code, refresh_token]
          client_id: forgejo
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://git.0xbf.ch/user/oauth2/authentik/callback
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: forgejo
        attrs:
          name: Git (Forgejo)
          provider: !KeyOf provider
          meta_launch_url: https://git.0xbf.ch
      # Only these groups may log in.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-developers
        attrs:
          order: 0
  jellyfin.yaml: |
    # OIDC for Jellyfin (SSO plugin, K0lin fork). The client secret is
    # JELLYFIN_OIDC_CLIENT_SECRET in authentik-secrets; the same value is in
    # media/jellyfin-sso-config (the plugin's SSO-Auth.xml).
    version: 1
    metadata:
      name: 0xbf app jellyfin
    entries:
      # Groups again here (idempotent), so this file does not depend on base.yaml order.
      - model: authentik_core.group
        id: group-family
        identifiers:
          name: family
      - model: authentik_core.group
        id: group-friends
        identifiers:
          name: friends
      - model: authentik_core.group
        id: group-developers
        identifiers:
          name: developers
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: jellyfin
        attrs:
          client_type: confidential
          # Required: the per-provider allowlist defaults to empty in blueprints,
          # and authentik then rejects every flow ("Invalid grant_type").
          grant_types: [authorization_code, refresh_token]
          client_id: jellyfin
          client_secret: !Env JELLYFIN_OIDC_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://stream.0xbf.ch/sso/OID/redirect/authentik
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: jellyfin
        attrs:
          name: Stream (Jellyfin)
          provider: !KeyOf provider
          meta_launch_url: https://stream.0xbf.ch
      # Only these groups may log in.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-family
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-friends
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-developers
        attrs:
          order: 2
  # Upstream example/flows-recovery-email-verification.yaml (2026.8.5), slug
  # "recover", mail from the global settings (noreply@0xbf.ch). Copied, not
  # nested. Adds "Forgot password?" to the login and the brand.
  recovery.yaml: |
    version: 1
    metadata:
      name: 0xbf recovery
    entries:
      - identifiers:
          slug: recover
        id: flow
        model: authentik_flows.flow
        attrs:
          name: Reset your 0xbf password
          title: Reset your password
          designation: recovery
          authentication: require_unauthenticated
      - identifiers:
          name: 0xbf-recovery-field-password
        id: prompt-field-password
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          order: 0
          placeholder_expression: false
      - identifiers:
          name: 0xbf-recovery-field-password-repeat
        id: prompt-field-password-repeat
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          order: 1
          placeholder_expression: false
      - identifiers:
          name: 0xbf-recovery-skip-if-restored
        id: default-recovery-skip-if-restored
        model: authentik_policies_expression.expressionpolicy
        attrs:
          expression: |
            return bool(request.context.get('is_restored', True))
      - identifiers:
          name: 0xbf-recovery-email
        id: default-recovery-email
        model: authentik_stages_email.emailstage
        attrs:
          use_global_settings: true
          host: localhost
          port: 25
          username: ""
          use_tls: false
          use_ssl: false
          timeout: 10
          from_address: system@authentik.local
          token_expiry: minutes=30
          subject: Reset your 0xbf password
          template: email/password_reset.html
          activate_user_on_success: true
          recovery_max_attempts: 5
          recovery_cache_timeout: minutes=5
      - identifiers:
          name: 0xbf-recovery-user-write
        id: default-recovery-user-write
        model: authentik_stages_user_write.userwritestage
        attrs:
          user_creation_mode: never_create
      - identifiers:
          name: 0xbf-recovery-identification
        id: default-recovery-identification
        model: authentik_stages_identification.identificationstage
        attrs:
          user_fields:
            - email
            - username
      - identifiers:
          name: 0xbf-recovery-user-login
        id: default-recovery-user-login
        model: authentik_stages_user_login.userloginstage
      - identifiers:
          name: 0xbf-recovery-change-password
        id: stages-prompt-password
        model: authentik_stages_prompt.promptstage
        attrs:
          fields:
            - !KeyOf prompt-field-password
            - !KeyOf prompt-field-password-repeat
          validation_policies: []
      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-identification
          order: 10
        model: authentik_flows.flowstagebinding
        id: flow-binding-identification
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-email
          order: 20
        model: authentik_flows.flowstagebinding
        id: flow-binding-email
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf stages-prompt-password
          order: 30
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-user-write
          order: 40
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-user-login
          order: 100
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - identifiers:
          policy: !KeyOf default-recovery-skip-if-restored
          target: !KeyOf flow-binding-identification
          order: 0
        model: authentik_policies.policybinding
        attrs:
          negate: false
          enabled: true
          timeout: 30
      - identifiers:
          policy: !KeyOf default-recovery-skip-if-restored
          target: !KeyOf flow-binding-email
          order: 0
        state: absent
        model: authentik_policies.policybinding
        attrs:
          negate: false
          enabled: true
          timeout: 30
      # Show "Forgot password?" on the login, and make it the brand's recovery flow.
      - identifiers:
          name: default-authentication-identification
        model: authentik_stages_identification.identificationstage
        attrs:
          # The serializer validates the whole stage: restate the stock fields.
          user_fields:
            - email
            - username
          recovery_flow: !KeyOf flow
      - identifiers:
          domain: authentik-default
        model: authentik_brands.brand
        attrs:
          flow_recovery: !KeyOf flow
  # Brand: title, the ^@ mark from apex, monochrome CSS (no background photo).
  brand.yaml: |
    version: 1
    metadata:
      name: 0xbf brand
    entries:
      - identifiers:
          domain: authentik-default
        model: authentik_brands.brand
        attrs:
          branding_title: "0xbf"
          branding_logo: https://0xbf.ch/assets/favicon.svg
          branding_favicon: https://0xbf.ch/assets/favicon.svg
          branding_custom_css: |
              /* 0xbf: monochrome, same palette as Forgejo, exhib and glob (oklch, zero chroma). */
              :root {
                --ak-global--background-image: none;
                --pf-global--primary-color--100: oklch(21% 0 0);
                --pf-global--primary-color--200: oklch(14% 0 0);
                --pf-global--primary-color--300: oklch(21% 0 0);
                --pf-global--primary-color--400: oklch(30% 0 0);
                --pf-global--active-color--100: oklch(21% 0 0);
                --pf-global--link--Color: oklch(21% 0 0);
                --pf-global--link--Color--hover: oklch(40% 0 0);
                --pf-c-button--m-primary--Color: oklch(96% 0 0);
                --pf-c-button--m-primary--hover--Color: oklch(96% 0 0);
                --pf-global--BackgroundColor--dark-100: oklch(96% 0 0);
              }
              html[data-theme="dark"], :host([theme="dark"]) {
                --pf-global--primary-color--100: oklch(92% 0 0);
                --pf-global--primary-color--200: oklch(84% 0 0);
                --pf-global--primary-color--300: oklch(92% 0 0);
                --pf-global--primary-color--400: oklch(84% 0 0);
                --pf-global--active-color--100: oklch(92% 0 0);
                --pf-global--link--Color: oklch(92% 0 0);
                --pf-global--link--Color--hover: oklch(72% 0 0);
                --pf-c-button--m-primary--Color: oklch(14% 0 0);
                --pf-c-button--m-primary--hover--Color: oklch(14% 0 0);
                --pf-global--BackgroundColor--dark-100: oklch(14% 0 0);
              }
              /* The flow photo is on body::before in the page document. */
              body::before { background-image: none !important; }
              html, body { background-color: oklch(96% 0 0) !important; }
              html[data-theme="dark"], html[data-theme="dark"] body { background-color: oklch(14% 0 0) !important; }
              @media (prefers-color-scheme: dark) {
                html:not([data-theme="light"]), html:not([data-theme="light"]) body { background-color: oklch(14% 0 0) !important; }
              }
              /* Footer and language picker were styled for text on the photo. */
              :root, :host {
                --ak-c-login__footer--Color: oklch(35% 0 0);
                --ak-c-locale-select--Color: oklch(35% 0 0);
                --ak-c-locale-select--label--Color: oklch(35% 0 0);
              }
              html[data-theme="dark"], :host([theme="dark"]) {
                --ak-c-login__footer--Color: oklch(75% 0 0);
                --ak-c-locale-select--Color: oklch(75% 0 0);
                --ak-c-locale-select--label--Color: oklch(75% 0 0);
              }
              ak-locale-select, .pf-c-login__footer, .pf-c-login__footer * { text-shadow: none !important; filter: none !important; }
              /* Dark theme sets the primary button text with a more specific rule. */
              html[data-theme="dark"] .pf-c-button.pf-m-primary,
              :host([theme="dark"]) .pf-c-button.pf-m-primary { color: oklch(14% 0 0) !important; }
      # The login heading is the flow title. Full validation: restate name,
      # slug, designation.
      - identifiers:
          slug: default-authentication-flow
        model: authentik_flows.flow
        attrs:
          name: Welcome to 0xbf
          title: Welcome to 0xbf
          designation: authentication
  grafana.yaml: |
    # Grafana at grafana.internal (group developers). Public client with PKCE:
    # Grafana holds no secret. authentik Admins get the Grafana Admin role
    # (role_attribute_path in kube-prometheus-stack.yaml).
    version: 1
    metadata:
      name: 0xbf app grafana
    entries:
      - model: authentik_core.group
        id: group-developers
        identifiers:
          name: developers
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: grafana
        attrs:
          client_type: public
          # Required in blueprints (empty = every login rejected).
          grant_types: [authorization_code, refresh_token]
          client_id: grafana
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.internal/login/generic_oauth
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf provider
          meta_launch_url: https://grafana.internal
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !KeyOf group-developers
        attrs:
          order: 0
  # Native OIDC apps. Public clients with PKCE where the app supports it
  # (Dawarich); Immich needs a client secret (!Env from authentik-secrets).
  apps-oidc.yaml: |
    version: 1
    metadata:
      name: 0xbf apps oidc
    entries:
      - model: authentik_core.group
        id: group-family
        identifiers:
          name: family
      - model: authentik_core.group
        id: group-friends
        identifiers:
          name: friends
      - model: authentik_core.group
        id: group-developers
        identifiers:
          name: developers
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-dawarich
        identifiers:
          name: dawarich
        attrs:
          client_type: public
          grant_types: [authorization_code, refresh_token]
          client_id: dawarich
          redirect_uris:
            - matching_mode: strict
              url: https://dawarich.internal/users/auth/openid_connect/callback
              redirect_uri_type: authorization
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        id: app-dawarich
        identifiers:
          slug: dawarich
        attrs:
          name: Dawarich
          provider: !KeyOf provider-dawarich
          meta_launch_url: https://dawarich.internal
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-dawarich
          group: !KeyOf group-family
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-dawarich
