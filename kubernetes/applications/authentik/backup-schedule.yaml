apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: authentik-backup
  namespace: authentik
spec:
  backup:
    schedule: "0 5 * * *"
    failedJobsHistoryLimit: 3
  prune:
    schedule: "0 7 * * *"
    failedJobsHistoryLimit: 3
    retention:
      keepLast: 5
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
