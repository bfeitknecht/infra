apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-db
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-nvme
  resources:
    requests:
      storage: 10Gi
---
# Own Postgres instead of the chart's Bitnami subchart. Same pattern as immich.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-db
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-db
      # k8up backs up a pg_dump stream, not the live data files.
      annotations:
        k8up.io/backupcommand: sh -c 'pg_dump -U authentik authentik'
        k8up.io/file-extension: .sql
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.12-trixie
          env:
            - name: POSTGRES_USER
              value: authentik
            - name: POSTGRES_DB
              value: authentik
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_POSTGRESQL__PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "authentik", "-d", "authentik"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authentik-db
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-db
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/name: authentik-db
  ports:
    - name: postgres
      port: 5432
