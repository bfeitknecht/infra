apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 30m
  # Fixed release name so Services are authentik-server, not authentik-authentik-server.
  releaseName: authentik
  chart:
    spec:
      chart: authentik
      version: "2026.8.5"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  targetNamespace: authentik
  values:
    global:
      # authentik-secrets is env and has no hash suffix: bump this after every
      # change to it, so server and worker restart and blueprints see new keys.
      podAnnotations:
        0xbf.ch/secrets-rev: "2026-11-19"
      nodeSelector:
        kubernetes.io/hostname: rzbl
      # Non-secret config. The Secret authentik-secrets holds the rest.
      env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-db
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        # Mail via Proton SMTP as noreply@0xbf.ch (AGENTS.md "Mail").
        # AUTHENTIK_EMAIL__PASSWORD is in authentik-secrets.
        - name: AUTHENTIK_EMAIL__HOST
          value: smtp.protonmail.ch
        - name: AUTHENTIK_EMAIL__PORT
          value: "587"
        - name: AUTHENTIK_EMAIL__USERNAME
          value: noreply@0xbf.ch
        - name: AUTHENTIK_EMAIL__USE_TLS
          value: "true"
        - name: AUTHENTIK_EMAIL__FROM
          value: "0xbf <noreply@0xbf.ch>"
        - name: AUTHENTIK_EMAIL__TIMEOUT
          value: "15"
    authentik:
      # Holds AUTHENTIK_SECRET_KEY, AUTHENTIK_POSTGRESQL__PASSWORD,
      # AUTHENTIK_BOOTSTRAP_PASSWORD, AUTHENTIK_BOOTSTRAP_EMAIL.
      # Bootstrap password sets akadmin on first start, so the initial-setup
      # flow is never open on the public URL.
      existingSecret:
        secretName: authentik-secrets
    blueprints:
      configMaps:
        - authentik-blueprints
    postgresql:
      enabled: false
