# HTTPRoutes of forward-auth apps send /outpost.goauthentik.io to authentik-server.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: outpost-routes
  namespace: authentik
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: opencode
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: agents
  to:
    - group: ""
      kind: Service
      name: authentik-server
