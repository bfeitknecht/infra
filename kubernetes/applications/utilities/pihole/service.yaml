apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: pihole
spec:
  type: LoadBalancer
  # Static from the lan-pool: the router's DHCP DNS field and Tailscale split
  # DNS point here, so the address must never float (Gateway holds .128).
  loadBalancerIP: 10.10.20.153
  selector:
    app: pihole
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
