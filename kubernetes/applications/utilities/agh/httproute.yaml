apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agh
  namespace: agh
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - agh.internal
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: agh
          port: 80
