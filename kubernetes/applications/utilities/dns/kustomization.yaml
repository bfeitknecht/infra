apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dns
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: kresd-config
    files:
      - kresd/config.yaml
  - name: knot-config
    files:
      - knot/knot.conf
      - knot/internal.zone
