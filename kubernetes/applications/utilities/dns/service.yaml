apiVersion: v1
kind: Service
metadata:
  name: kresd
  namespace: dns
spec:
  type: ClusterIP
  # Pinned so Pi-hole can forward to a stable address; pod IPs change on
  # reschedule and Pi-hole upstreams are IP literals. 10.96.0.1 is the
  # apiserver, .10 cluster DNS — .53 is reserved for this resolver.
  clusterIP: 10.96.0.53
  selector:
    app: dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
