apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      initContainers:
        # Register once. The .runner file on the PVC holds the identity.
        - name: register
          image: code.forgejo.org/forgejo/runner:13.2.1
          command:
            - sh
            - -c
            - |
              [ -f /data/.runner ] && exit 0
              forgejo-runner register --no-interactive \
                --instance https://git.0xbf.ch \
                --token "$RUNNER_TOKEN" \
                --name rzbl \
                --labels docker:docker://node:22-bookworm,ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04
          workingDir: /data
          env:
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secrets
                  key: RUNNER_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:13.2.1
          command: ["sh", "-c", "until docker info >/dev/null 2>&1; do sleep 2; done; forgejo-runner daemon"]
          workingDir: /data
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
        # Jobs run as containers in this Docker daemon. It is not shared with the node.
        - name: dind
          image: docker.io/docker:28-dind
          args: ["--host=tcp://127.0.0.1:2375", "--tls=false"]
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: docker
              mountPath: /var/lib/docker
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: runner-data
        - name: docker
          emptyDir: {}
