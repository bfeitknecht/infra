# Public route for friends and family. Enable only after the setup wizard is
# done (the wizard runs without login).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-public
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - videos.0xbf.ch
  rules:
    - backendRefs:
        - name: jellyfin
          port: 80
---
# The old name (stream.0xbf.ch, until 2026-11-25): a permanent redirect, so apps and
# bookmarks that still use it find the new one. Drop it once nothing does.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-old-name
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - stream.0xbf.ch
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: videos.0xbf.ch
            statusCode: 301
