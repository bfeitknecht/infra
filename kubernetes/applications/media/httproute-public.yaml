# Public route for friends and family. Enable only after the setup wizard is
# done (the wizard runs without login).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-public
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - videos.0xbf.ch
  rules:
    - backendRefs:
        - name: jellyfin
          port: 80
