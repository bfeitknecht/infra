# Public route for friends and family.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-public
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - videos.0xbf.ch
  rules:
    # No password sign-in from the internet: authentik (SSO plugin) in the
    # browser, Quick Connect in the apps. Jellyfin routes are
    # case-insensitive, so the match is too. Password sign-in (native admin)
    # works on jellyfin.internal only.
    - matches:
        - path:
            type: RegularExpression
            value: "(?i)^/+(emby/+)?users/+(authenticatebyname|[^/]+/+authenticate)/*$"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: deny-all
      backendRefs:
        - name: jellyfin
          port: 80
    - backendRefs:
        - name: jellyfin
          port: 80
