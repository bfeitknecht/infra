# One library volume on the rzbl 4 TB SSD. Jellyfin and the *arr apps share
# it, so imports are moves on one filesystem. Config volumes are on NVMe.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-files
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-ssd
  resources:
    requests:
      storage: 2Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-nvme
  resources:
    requests:
      storage: 20Gi
---
