apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-allowlist
  namespace: media
spec:
  ipAllowList:
    sourceRange:
      - 10.10.0.0/16
      # Middleware must be in the route namespace. Copy of the ingress one.
      - 100.64.0.0/10
---
# 403 for everyone: no client comes from 127.0.0.1 through the gateway.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-all
  namespace: media
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
