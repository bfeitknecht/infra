apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-allowlist
  namespace: media
spec:
  ipAllowList:
    sourceRange:
      - 10.10.0.0/16
      # Middleware must be in the route namespace. Copy of the ingress one.
      - 100.64.0.0/10
---
# Forward auth to authentik-server (embedded outpost). Middleware must be in
# the route namespace: copy of the ingress one. The navidrome and bazarr
# routes use it; it lived only in the cluster until 2026-11-23 (drift).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: media
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
    trustForwardHeader: true
