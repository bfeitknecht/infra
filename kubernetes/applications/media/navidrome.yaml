# Music streaming (Subsonic API: Symfonium, Feishin, Supersonic, play:Sub).
# Reads the Lidarr library read-only. The first login creates the admin.
# One host: music.0xbf.ch (forward auth, family + friends + developers),
# also from the LAN; navidrome.internal was dropped 2026-11-24.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
  labels:
    app.kubernetes.io/name: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: navidrome
          image: docker.io/deluan/navidrome:0.64.2
          env:
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_SCANSCHEDULE
              value: 1h
            - name: ND_LOGLEVEL
              value: info
            # Login through authentik forward auth: Navidrome trusts the user
            # header from the pod network. CNP navidrome-ingress lets only
            # Traefik and Gatus reach the pod, so the header cannot be forged.
            # /rest (Subsonic apps) bypasses forward auth: apps use the
            # Navidrome password of the user (set it in Navidrome > Profile).
            - name: ND_EXTAUTH_USERHEADER
              value: X-authentik-username
            - name: ND_EXTAUTH_TRUSTEDSOURCES
              value: 10.244.0.0/16
            - name: TZ
              value: Europe/Zurich
          ports:
            - name: http
              containerPort: 4533
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: library
              mountPath: /music
              subPath: media/music
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: library
          persistentVolumeClaim:
            claimName: media-files
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: navidrome
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Public music.0xbf.ch: forward auth (authentik app music, family + friends
# + developers). No internal-allowlist: it is the public listener. The
# wildcard-domain cert covers the name. /rest stays on the Navidrome
# password (Subsonic apps log in themselves); the web UI gets the header
# login (Navidrome auto-creates the user from X-authentik-username).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: navidrome-public
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - music.0xbf.ch
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    # Subsonic API for phone apps: no forward auth (Navidrome password).
    - matches:
        - path:
            type: PathPrefix
            value: /rest
      backendRefs:
        - name: navidrome
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - name: navidrome
          port: 80
