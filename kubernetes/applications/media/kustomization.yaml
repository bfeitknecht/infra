apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - middleware.yaml
  - pvc.yaml
  - jellyfin.yaml
  - jellyfin-sso-config.sops.yaml
  - sonarr.yaml
  - radarr.yaml
  - lidarr.yaml
  - navidrome.yaml
  - navidrome-networkpolicy.yaml
  - bazarr.yaml
  - authentik.yaml
  - prowlarr.yaml
  - flaresolverr.yaml
  - seerr.yaml
  # Public videos.0xbf.ch (wizard done 2026-11-16).
  - httproute-public.yaml
configMapGenerator:
  # Jellyfin branding: branding.xml (logo, monochrome CSS, login note; UI
  # edits are overwritten on every start) and the web client patch (icons,
  # manifest, login.css; initContainer `web`).
  - name: jellyfin-branding
    namespace: media
    files:
      - jellyfin-branding/branding.xml
      - jellyfin-branding/login.css
      - jellyfin-branding/manifest.json
      - jellyfin-branding/favicon.svg
      - jellyfin-branding/favicon.ico
      - jellyfin-branding/apple-touch-icon.png
      - jellyfin-branding/icon-192.png
      - jellyfin-branding/icon-512.png
