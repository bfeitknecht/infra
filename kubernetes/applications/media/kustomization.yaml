apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - middleware.yaml
  - pvc.yaml
  - jellyfin.yaml
  - jellyfin-sso-config.sops.yaml
  - sonarr.yaml
  - radarr.yaml
  - lidarr.yaml
  - navidrome.yaml
  - navidrome-networkpolicy.yaml
  - authentik.yaml
  - prowlarr.yaml
  # Public stream.0xbf.ch (wizard done 2026-11-16).
  - httproute-public.yaml
configMapGenerator:
  # Jellyfin branding (logo, monochrome CSS, login note). Git owns it: the
  # initContainer copies it on every start, UI edits are overwritten.
  - name: jellyfin-branding
    namespace: media
    files:
      - jellyfin-branding/branding.xml
