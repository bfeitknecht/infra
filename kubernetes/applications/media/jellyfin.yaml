apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
      annotations:
        # Bump after a jellyfin-sso-config change (Secret has no hash suffix).
        0xbf.ch/config-rev: "2026-11-19b"
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      # GTX 1660 Ti for NVENC/NVDEC transcoding.
      runtimeClassName: nvidia
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Git owns branding.xml (logo, CSS, login note) and the server name
        # (tab title, name in the apps): both are written on every start.
        - name: branding
          image: docker.io/library/busybox:1.38.0
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /config/config
              cp /branding/branding.xml /config/config/branding.xml
              if [ -f /config/config/system.xml ]; then
                sed -i 's|<ServerName>[^<]*</ServerName>|<ServerName>0xbf videos</ServerName>|' /config/config/system.xml
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: branding
              mountPath: /branding
              readOnly: true
        # SSO plugin (K0lin fork of 9p4/jellyfin-plugin-sso, Jellyfin 12):
        # pinned release, sha256-checked, unpacked once per version. The
        # plugin config SSO-Auth.xml is seeded only while it has no `authentik`
        # provider: the plugin stores its account links in the same file. To
        # re-seed, delete /config/plugins/configurations/SSO-Auth.xml. Format:
        # per-provider element is <PluginConfiguration>, not <OidConfig>
        # (written by the plugin API; Jellyfin silently resets an unreadable file).
        - name: sso-plugin
          image: docker.io/library/alpine:3.24
          env:
            - name: VERSION
              value: "5.1.1"
            - name: SHA256
              value: db126b4763bda3a3754fa2103232fc03ef1bf929cfeda35f2e9af39c875233b1
          command:
            - sh
            - -c
            - |
              set -eu
              dir=/config/plugins/SSO-Auth_${VERSION}
              if [ ! -f "$dir/SSO-Auth.dll" ]; then
                wget -q -O /tmp/sso.zip "https://github.com/K0lin/jellyfin-plugin-sso/releases/download/v${VERSION}/sso-authentication_${VERSION}.zip"
                echo "${SHA256}  /tmp/sso.zip" | sha256sum -c -
                rm -rf /config/plugins/SSO-Auth_*
                mkdir -p "$dir"
                unzip -o -q /tmp/sso.zip -d "$dir"
              fi
              mkdir -p /config/plugins/configurations
              grep -q '<string>authentik</string>' /config/plugins/configurations/SSO-Auth.xml 2>/dev/null || cp /sso/SSO-Auth.xml /config/plugins/configurations/SSO-Auth.xml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: sso
              mountPath: /sso
              readOnly: true
        # Jellyfin Enhanced: requests from Jellyfin search (Seerr in the
        # background, users already signed in through authentik), plus
        # display extras. Pinned + sha256 like the SSO plugin. Its settings
        # live in the Jellyfin dashboard (Plugins > Jellyfin Enhanced).
        - name: enhanced-plugin
          image: docker.io/library/alpine:3.24
          env:
            - name: VERSION
              value: "12.16.0.0"
            - name: SHA256
              value: 2598d53fef00aa5c234c602cf0ee99ad216b83058d0d8e1d6531405479b9db2c
          command:
            - sh
            - -c
            - |
              set -eu
              dir=/config/plugins/JellyfinEnhanced_${VERSION}
              if [ ! -f "$dir/Jellyfin.Plugin.JellyfinEnhanced.dll" ]; then
                wget -q -O /tmp/je.zip "https://github.com/n00bcodr/Jellyfin-Enhanced/releases/download/${VERSION}/Jellyfin.Plugin.JellyfinEnhanced_12.0.0.zip"
                echo "${SHA256}  /tmp/je.zip" | sha256sum -c -
                rm -rf /config/plugins/JellyfinEnhanced_*
                mkdir -p "$dir"
                unzip -o -q /tmp/je.zip -d "$dir"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
        # The web client, patched: tab title, description, 0xbf icons, app
        # manifest, and login.css (hides the password form). A copy of the
        # image's own jellyfin-web, so it follows every Jellyfin upgrade. Same
        # image tag as the server. If the sed patterns stop matching after an
        # upgrade, the log says so and Jellyfin starts unbranded.
        - name: web
          image: docker.io/jellyfin/jellyfin:12.4
          command:
            - sh
            - -c
            - |
              set -eu
              cp -R /jellyfin/jellyfin-web/. /web/
              cd /web
              mkdir -p 0xbf
              for f in login.css favicon.svg favicon.ico apple-touch-icon.png icon-192.png icon-512.png; do
                cp "/branding/$f" "0xbf/$f"
              done
              : > 0xbf/empty.css
              cp /branding/manifest.json manifest.json
              sed -i \
                -e 's|<title>[^<]*</title>|<title>0xbf videos</title><meta name="description" content="Films and series. Invite only.">|' \
                -e 's|<meta name="application-name" content="[^"]*">|<meta name="application-name" content="0xbf videos">|' \
                -e 's|<link rel="apple-touch-icon"[^>]*>|<link rel="apple-touch-icon" sizes="180x180" href="0xbf/apple-touch-icon.png">|' \
                -e 's|<link rel="shortcut icon"[^>]*>|<link rel="icon" type="image/svg+xml" href="0xbf/favicon.svg"><link rel="icon" sizes="32x32" href="0xbf/favicon.ico"><link rel="stylesheet" href="0xbf/login.css">|' \
                -e 's|<meta name="msapplication-TileImage"[^>]*>||' \
                index.html
              grep -q '0xbf/login.css' index.html || echo "web: index.html patterns did not match; jellyfin-web is unbranded" >&2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: web
              mountPath: /web
            - name: branding
              mountPath: /branding
              readOnly: true
      containers:
        - name: jellyfin
          image: docker.io/jellyfin/jellyfin:12.4
          env:
            - name: TZ
              value: Europe/Zurich
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          ports:
            - name: http
              containerPort: 8096
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 6Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            # Same /data path in every media container (TRaSH Guides layout):
            # /data/torrents/{movies,tv}, /data/media/{movies,tv}. Hardlinks and
            # instant moves work only with one volume and one path.
            - name: library
              mountPath: /data
            # The patched web client from initContainer `web`.
            - name: web
              mountPath: /jellyfin/jellyfin-web
              readOnly: true
      volumes:
        - name: web
          emptyDir:
            sizeLimit: 256Mi
        - name: sso
          secret:
            secretName: jellyfin-sso-config
        - name: branding
          projected:
            sources:
              - configMap:
                  name: jellyfin-branding
              - configMap:
                  name: jellyfin-branding-png
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-data
        - name: cache
          emptyDir: {}
        - name: library
          persistentVolumeClaim:
            claimName: media-files
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 80
      targetPort: 8096
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - jellyfin.internal
  rules:
    # Internal only: the password form stays (native admin sign-in).
    - matches:
        - path:
            type: Exact
            value: /web/0xbf/login.css
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /web/0xbf/empty.css
      backendRefs:
        - name: jellyfin
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: jellyfin
          port: 80
