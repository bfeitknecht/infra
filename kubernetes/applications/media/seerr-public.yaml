# Public request.0xbf.ch for friends and family. Enable (kustomization.yaml)
# only after the Seerr setup wizard is done: the wizard runs without login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-public
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - request.0xbf.ch
  rules:
    - backendRefs:
        - name: seerr
          port: 80
