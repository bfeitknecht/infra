apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pds
  namespace: pds
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  # Wildcard on purpose: this route IS the handle-resolution mechanism —
  # https://<handle>/.well-known/atproto-did must answer for every account
  # (pds.0xbf.ch itself matches too). Owner-accepted tradeoff: unrouted
  # *.0xbf.ch subdomains fall through to the PDS (benign 404s); exact-match
  # routes (apex, git, whims, future apps) always win precedence.
  hostnames:
    - "*.0xbf.ch"
  rules:
    - backendRefs:
        - name: pds-http
          port: 80