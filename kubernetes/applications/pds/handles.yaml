# One exact HTTPRoute per account handle. This is the handle-resolution mechanism:
# https://<handle>/.well-known/atproto-did must reach the PDS,
# which answers from its account DB (no DNS TXT records involved).
# Creating an account = goat account create + one route here + tag.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pds-handle-bf
  namespace: pds
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - someone.0xbf.ch
  rules:
    - backendRefs:
        - name: pds
          port: 80
