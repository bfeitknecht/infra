apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: pds-backup
  namespace: pds
spec:
  # Times fire in Europe/Zurich (operator-level k8up.timezone).
  # Staggered half an hour behind forgejo.
  # Jobs fail until the Garage NAS tailnet path is fixed.
  backup:
    schedule: "30 3 * * *"
    failedJobsHistoryLimit: 3
  prune:
    schedule: "30 5 * * *"
    failedJobsHistoryLimit: 3
    retention:
      keepLast: 5
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
