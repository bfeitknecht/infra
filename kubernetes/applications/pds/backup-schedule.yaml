apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: pds-backup
  namespace: pds
spec:
  # Times use Europe/Zurich. Stagger 30m behind forgejo. Jobs fail until
  # NAS path is fixed.
  backup:
    schedule: "30 3 * * *"
    failedJobsHistoryLimit: 3
  prune:
    schedule: "30 5 * * *"
    failedJobsHistoryLimit: 3
    retention:
      keepLast: 5
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
