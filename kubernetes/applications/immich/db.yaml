apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-db
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      containers:
        - name: postgres
          # Postgres 16 since 2026-11-28 (dump/restore from 14; Immich supports
          # 14 to 19). Data in pg16/; old pgdata/ (14) and dump-pg14-20261128.sql
          # stay on the PVC as the rollback. A major = a new PGDATA directory.
          image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: PGDATA
              value: /var/lib/postgresql/data/pg16
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "immich"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-db
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-db
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-db
  ports:
    - name: main
      port: 5432
      targetPort: 5432
