# PNG icons as binaryData. Not plain .png files in git: Flux drops *.png
# twice (flux push artifact and the OCIRepository ignore list), so the build
# cannot find them. Copies of apex brand/png/mark-{180,192,512}.png.
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-branding-png
  namespace: immich
binaryData:
  apple-touch-icon.png: 
  icon-192.png: 
  icon-512.png: 
