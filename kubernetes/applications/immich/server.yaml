apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
      annotations:
        # Immich reads immich.json only at start and the Secret has no hash
        # suffix: bump this after every immich-config change.
        0xbf.ch/config-rev: "2026-11-24"
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      initContainers:
        # The web client, patched: 0xbf icons, tab title and description; the
        # look stays Immich. A copy of the image's own /build/www (same tag
        # as the server), so it follows every upgrade. sirv serves the
        # precompressed .br/.gz first: delete them for every patched file.
        # Unmatched patterns leave Immich unbranded, never broken.
        - name: web
          image: ghcr.io/immich-app/immich-server:v3.4.1
          command:
            - sh
            - -c
            - |
              set -eu
              cp -R /build/www/. /web/
              cd /web
              cp /branding/favicon.ico favicon.ico
              cp /branding/favicon.svg icon.svg
              cp /branding/apple-touch-icon.png apple-icon-180.png
              cp /branding/icon-192.png manifest-icon-192.maskable.png
              cp /branding/icon-512.png manifest-icon-512.maskable.png
              sed -i \
                -e 's|<!-- metadata:tags -->|<!-- metadata:tags -->\n    <title>0xbf photos</title>\n    <meta name="description" content="Photos. Invite only." />|' \
                index.html
              sed -i \
                -e 's|"name": "Immich"|"name": "0xbf photos"|' \
                -e 's|"short_name": "Immich"|"short_name": "photos"|' \
                -e 's|"description": "[^"]*"|"description": "Photos. Invite only."|' \
                -e 's|"any maskable"|"any"|g' \
                manifest.json
              # Page titles: "Albums - Immich" becomes "Albums · 0xbf".
              grep -rl ' - Immich`' _app | while read -r f; do
                sed -i 's/ - Immich`/ · 0xbf`/g' "$f"
                rm -f "$f.br" "$f.gz"
              done
              rm -f icon.svg.br icon.svg.gz index.html.br index.html.gz manifest.json.br manifest.json.gz
              grep -q '0xbf photos' index.html || echo "web: index.html pattern did not match; Immich is unbranded" >&2
          volumeMounts:
            - name: web
              mountPath: /web
            - name: branding
              mountPath: /branding
              readOnly: true
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.4.1
          env:
            # OIDC (authentik) and SMTP (Proton). Settings in this file are
            # read-only in the admin UI; edit immich-config instead.
            - name: IMMICH_CONFIG_FILE
              value: /config/immich.json
            - name: TZ
              value: Europe/Zurich
            - name: DB_HOSTNAME
              value: immich-db
            - name: DB_USERNAME
              value: postgres
            - name: DB_DATABASE_NAME
              value: immich
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 2283
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: library
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            # The patched web client from initContainer `web`.
            - name: web
              mountPath: /build/www
              readOnly: true
      volumes:
        - name: web
          emptyDir:
            sizeLimit: 512Mi
        - name: branding
          configMap:
            name: immich-branding
        - name: config
          secret:
            secretName: immich-config
        - name: library
          persistentVolumeClaim:
            claimName: immich-files
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - name: main
      port: 80
      targetPort: 2283
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - immich.internal
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: immich-server
          port: 80
---
# Public by purpose (photos), internal by software (immich). Login is
# authentik OIDC (family, developers); share links use this name
# (server.externalDomain in immich-config).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-public
  namespace: immich
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - photos.0xbf.ch
  rules:
    # The first sign-up becomes the Immich admin. Never through the public
    # name: the exact match wins over "/" and never reaches the server.
    # Create the admin at immich.internal.
    - matches:
        - path:
            type: Exact
            value: /api/auth/admin-sign-up
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    - backendRefs:
        - name: immich-server
          port: 80
