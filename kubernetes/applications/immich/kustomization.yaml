apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - middleware.yaml
  - pvc.yaml
  - db.yaml
  - redis.yaml
  - server.yaml
  - immich-branding-png.yaml
  - machine-learning.yaml
  - immich-secrets.sops.yaml
  - immich-config.sops.yaml
configMapGenerator:
  # 0xbf icons for the web client (initContainer `web` in server.yaml).
  # Copies of apex/brand: favicon.ico, mark.svg. The PNGs are in
  # immich-branding-png.yaml (binaryData).
  - name: immich-branding
    namespace: immich
    files:
      - branding/favicon.ico
      - branding/favicon.svg
