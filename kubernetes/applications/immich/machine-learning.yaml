# Service name must be immich-machine-learning. The server default URL is
# http://immich-machine-learning:3003.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-machine-learning
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-machine-learning
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      # GPU: one time-slice of the GTX 1660 Ti (4 slots, 6 GB VRAM shared with
      # jellyfin and ollama, no isolation).
      runtimeClassName: nvidia
      enableServiceLinks: false
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.4.2-cuda
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: MACHINE_LEARNING_MODEL_REVISION
              value: v2
          ports:
            - containerPort: 3003
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 6Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-cache
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-machine-learning
  ports:
    - name: main
      port: 3003
      targetPort: 3003
