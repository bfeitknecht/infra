apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
  namespace: copyparty
  labels:
    app.kubernetes.io/name: copyparty
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: copyparty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copyparty
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copyparty
          image: docker.io/copyparty/ac:1.20.26
          # Accounts and volumes are in copyparty.conf (Secret, it holds passwords).
          args: ["-c", "/cfg/copyparty.conf"]
          ports:
            - containerPort: 3923
          readinessProbe:
            tcpSocket:
              port: 3923
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: files
              mountPath: /w
            - name: config
              mountPath: /cfg
              readOnly: true
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: copyparty-files
        - name: config
          secret:
            secretName: copyparty-config
---
apiVersion: v1
kind: Service
metadata:
  name: copyparty
  namespace: copyparty
spec:
  selector:
    app.kubernetes.io/name: copyparty
  ports:
    - name: main
      port: 80
      targetPort: 3923
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty
  namespace: copyparty
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - files.internal
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: copyparty
          port: 80
