apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
  namespace: copyparty
  labels:
    app.kubernetes.io/name: copyparty
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: copyparty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copyparty
      annotations:
        # copyparty reads copyparty.conf at start and the Secret has no hash
        # suffix: bump this after every copyparty-config change.
        0xbf.ch/config-rev: "2026-11-20"
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copyparty
          image: docker.io/copyparty/ac:1.20.26
          # Accounts and volumes are in copyparty.conf (Secret, it holds passwords).
          # No args: the image runs `-c /z/initcfg`, which includes every file
          # in /cfg (`% /cfg`). A second `-c /cfg/copyparty.conf` mounted the
          # volume twice and copyparty refused to start.
          env:
            # Writable config home on the volume: file and dir keys (share
            # links) survive restarts.
            - name: XDG_CONFIG_HOME
              value: /w/.hist/config
          ports:
            - containerPort: 3923
          readinessProbe:
            tcpSocket:
              port: 3923
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: files
              mountPath: /w
            - name: config
              mountPath: /cfg
              readOnly: true
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: copyparty-files
        # copyparty.conf (Secret: accounts, volumes) and branding.conf.
        - name: config
          projected:
            sources:
              - secret:
                  name: copyparty-config
              - configMap:
                  name: copyparty-branding
---
apiVersion: v1
kind: Service
metadata:
  name: copyparty
  namespace: copyparty
spec:
  selector:
    app.kubernetes.io/name: copyparty
  ports:
    - name: main
      port: 80
      targetPort: 3923
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty
  namespace: copyparty
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - copyparty.internal
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: strip-identity
      backendRefs:
        - name: copyparty
          port: 80
---
# Public by purpose (files), internal by software (copyparty). Login is
# authentik (family, developers); copyparty reads the user from the
# X-authentik-* headers. Share links (/shr/) and the static assets they need
# (/.cpr/) skip authentik, with the identity headers stripped.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty-public
  namespace: copyparty
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - files.0xbf.ch
  rules:
    # authentik forward auth callback (sign-in, sign-out) on this host.
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /shr/
        - path:
            type: PathPrefix
            value: /.cpr/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: strip-identity
      backendRefs:
        - name: copyparty
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - name: copyparty
          port: 80
