# Forward auth: Traefik asks the authentik embedded outpost before each request.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: copyparty
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
---
# copyparty logs a request in as X-authentik-username. Where authentik does
# not run (share links, the internal route), a client must not set it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-identity
  namespace: copyparty
spec:
  headers:
    customRequestHeaders:
      X-authentik-username: ""
      X-authentik-groups: ""
      X-authentik-email: ""
      X-authentik-name: ""
      X-authentik-uid: ""
