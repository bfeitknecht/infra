# 0xbf branding: tab title, server name, favicon, description. Merged with
# copyparty.conf (Secret): /z/initcfg includes every file in /cfg.
[global]
  name: 0xbf files
  doctitle: 0xbf files
  # The text favicon (an emoji) wins over ufavico unless blank.
  favico:
  ufavico: https://0xbf.ch/assets/favicon.svg
  html-head-s: <meta name="description" content="Files and share links.">
