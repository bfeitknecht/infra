apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin
  namespace: atuin
spec:
  replicas: 1
  # Use Recreate. The DB uses RWO volume. Two instances cannot share the DB.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atuin
  template:
    metadata:
      labels:
        app: atuin
    spec:
      # Service atuin creates ATUIN_PORT service-link variable. Atuin ignores
      # this variable. Set explicit env to remove ambiguity.
      enableServiceLinks: false
      containers:
        - name: atuin
          image: ghcr.io/atuinsh/atuin:18.24.2
          # Entrypoint is atuin-server. Args start runs the server.
          args: ["start"]
          envFrom:
            - configMapRef:
                name: atuin-config
          ports:
            - containerPort: 8888
              name: http
          volumeMounts:
            - name: data
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: atuin-data
