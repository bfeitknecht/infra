apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: atuin-backup
  namespace: atuin
spec:
  # Times fire in Europe/Zurich (operator-level k8up.timezone).
  # Staggered behind forgejo (03:00/05:00) and pds (03:30/05:30).
  backup:
    schedule: "30 4 * * *"
    failedJobsHistoryLimit: 3
  prune:
    schedule: "30 6 * * *"
    failedJobsHistoryLimit: 3
    retention:
      keepLast: 5
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
