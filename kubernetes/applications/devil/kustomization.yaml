apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devil
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - httproute.yaml
  - tcproute.yaml
  - middleware.yaml
  - ghcr.sops.yaml
configMapGenerator:
  # the ghostty-web terminal page (ttyd serves it, -I in omni devil.nix):
  # hash suffix, so every edit rolls the pod
  - name: devil-ghostty-web
    files:
      - index.html=ghostty-web/index.html
