apiVersion: apps/v1
kind: Deployment
metadata:
  name: devil
  namespace: devil
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devil
  template:
    metadata:
      labels:
        app: devil
    spec:
      # kata sizes the VM's vCPUs/RAM from the container limits —
      # without a CPU limit the VM boots with the kata default (single vCPU),
      # too slow for in-VM nix builds.
      runtimeClassName: kata-qemu
      hostname: devil
      # cluster DNS is unusable from the kata VM (ClusterIP bypass) —
      # the resolver pod IP rides the pod-to-pod path that works
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.244.0.242
      # The VM has no DNS path to cluster names;
      # the join dial must be by name (the cert carries no IP SANs)
      # and teleport.cluster.local is the pin-covered SAN on the auth host cert.
      # IPs track the pods — update together with auth_server in teleport.yaml.
      hostAliases:
        - ip: 10.244.1.209
          hostnames:
            - teleport.cluster.local
        - ip: 10.244.1.104
          hostnames:
            - teleport.internal
      # devil never talks to the k8s API — no SA token inside the VM
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerconfigjson
      # subPath mounts fail pod creation if the dir is missing;
      # local-path volumes start root-owned, so home goes to bf (uid 1000)
      initContainers:
        - name: init-state
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /volume/home /volume/teleport /volume/ssh && chown 1000:100 /volume/home"]
          volumeMounts:
            - name: state
              mountPath: /volume
      containers:
        - name: devil
          image: ghcr.io/bfeitknecht/devil:latest
          # The tag is meaningless — the image is only the bootstrap and all
          # updates happen inside the machine (nh os switch). :latest forces
          # imagePullPolicy Always, so every pod recreation takes the newest
          # pushed bootstrap.
          imagePullPolicy: Always
          # The image ships no entrypoint (plain rootfs-tarball import) —
          # the boot command lives here. /init is the docker-container
          # profile's shim: registers the store db, boots systemd, stays
          # fresh across in-container switches.
          command: ["/init"]
          # systemd as PID1 creates its own init.scope under /sys/fs/cgroup,
          # which the OCI spec mounts read-only — without this the manager
          # allocation fails and PID1 exits 255. The kata VM is the
          # isolation boundary, so privilege inside it buys back nothing.
          securityContext:
            privileged: true
          env:
            # NixOS stage 2 gates its remounts on $container (the
            # docker-container profile's dialect) and no runtime sets it.
            - name: container
              value: docker
          # A PTY gives the container a /dev/console — without it the shim
          # creates none and every unit's journal+console output (including
          # teleport's) is discarded instead of landing in kubectl logs.
          tty: true
          # Mounted at /etc/teleport-secrets, not /run/secrets: inside the
          # kata VM systemd may classify itself as a VM (not a container) and
          # overmount /run with a tmpfs, hiding the secret mount.
          # /etc/teleport-secrets is outside everything systemd and the
          # NixOS etc activation manage.
          volumeMounts:
            - name: teleport-token
              mountPath: /etc/teleport-secrets
              readOnly: true
            # teleport.yaml is Flux-managed infra plumbing (the kata VM's
            # working dial target is a cluster-specific fact) — mounted
            # over the image's /etc/teleport so targets change via tag,
            # not via image rebuild. The image must NOT declare an
            # environment.etc."teleport" entry: the NixOS etc activation
            # would clobber this mount with a symlink to the store.
            - name: teleport-config
              mountPath: /etc/teleport
              readOnly: true
            # the ghostty-web terminal page (see ghostty-web/) — ttyd in the
            # VM serves it (-I in omni devil.nix); configMapGenerator hash
            # rolls the pod on every edit
            - name: ghostty-web
              mountPath: /srv/ghostty-web
              readOnly: true
            # The agent's log lands on the node's filesystem — readable via
            # talosctl read while kubectl exec stays broken (systemd as PID1).
            - name: teleport-agent-log
              mountPath: /var/log/teleport
            # persistent /home, ssh host keys + teleport identity — pod
            # recreation no longer means a fresh machine
            - name: state
              mountPath: /home
              subPath: home
            # sshd host keys (devil.nix declares /var/lib/ssh) — without
            # this every pod recreation mints a new host key
            - name: state
              mountPath: /var/lib/ssh
              subPath: ssh
            - name: state
              mountPath: /var/lib/teleport
              subPath: teleport
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: teleport-token
          secret:
            secretName: devil-teleport-token
            # items rename: --token expects a file path — a plain secret
            # mount would make the target a directory of key-named files
            items:
              - key: token
                path: teleport-token
        - name: teleport-config
          configMap:
            name: devil-teleport-config
            items:
              - key: teleport.yaml
                path: teleport.yaml
        - name: ghostty-web
          configMap:
            name: devil-ghostty-web
            items:
              - key: index.html
                path: index.html
        - name: teleport-agent-log
          hostPath:
            path: /var/log/teleport
            type: DirectoryOrCreate
        - name: state
          persistentVolumeClaim:
            claimName: devil-pvc
