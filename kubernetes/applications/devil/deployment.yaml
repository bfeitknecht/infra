apiVersion: apps/v1
kind: Deployment
metadata:
  name: devil
  namespace: devil
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devil
  template:
    metadata:
      labels:
        app: devil
    spec:
      # Kata sets vCPU and RAM from container limits. Without a CPU limit the
      # VM boots with one vCPU. This is too slow for nix builds.
      runtimeClassName: kata-qemu
      hostname: devil
      # rzbl since 2026-11-23: Kata VMs on the Pi froze within minutes and
      # each force-delete left an orphan qemu that poisoned the node. amd64
      # KVM on the Blade is stable (opencode Kata runs there for weeks) and
      # devil's nix builds belong on the heavy node anyway.
      nodeSelector:
        kubernetes.io/hostname: rzbl
      # Devil does not use the Kubernetes API. Do not mount a service account token.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerconfigjson
      # SubPath mounts need the directory. Local-path volumes start as root.
      # Create the home directory for user 1000.
      initContainers:
        - name: init-state
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /volume/home /volume/ssh /volume/nix/store && chown 1000:100 /volume/home"]
          volumeMounts:
            - name: state
              mountPath: /volume
        # /nix lives on the PVC, so `nh os switch` inside the VM survives a
        # restart. Copy in every store path of the bootstrap image that the
        # PVC lacks (the first time: all of it). The image registers its paths
        # in the Nix db at each boot, so they must exist. Copy, then rename:
        # an interrupted copy never looks complete.
        - name: seed-nix
          image: ghcr.io/bfeitknecht/devil:latest
          imagePullPolicy: Always
          command:
            - /sw/bin/sh
            - -c
            - |
              set -eu
              export PATH=/sw/bin
              cd /nix/store
              rm -rf /volume/nix/store/.seed-*
              n=0
              for p in *; do
                [ -e "/volume/nix/store/$p" ] && continue
                cp -a "$p" "/volume/nix/store/.seed-$p"
                mv "/volume/nix/store/.seed-$p" "/volume/nix/store/$p"
                n=$((n + 1))
              done
              echo "seed-nix: copied $n store paths"
          volumeMounts:
            - name: state
              mountPath: /volume
      containers:
        - name: devil
          image: ghcr.io/bfeitknecht/devil:latest
          # The tag has no effect. The image is only bootstrap. Updates happen
          # inside the VM. Use :latest to pull the newest bootstrap.
          imagePullPolicy: Always
          # The image has no entrypoint. The boot command is here. /init
          # registers the store and boots systemd.
          # Boot the persisted system profile (the last `nh os switch`); the
          # image's /init only on the very first boot.
          command:
            - /sw/bin/sh
            - -c
            - |
              if [ -x /nix/var/nix/profiles/system/init ]; then
                exec /nix/var/nix/profiles/system/init
              fi
              exec /init
          # systemd as PID 1 ignores SIGTERM. SIGRTMIN+3 makes it power off
          # cleanly, so the Kata VM stops instead of hanging in Terminating.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "kill -s RTMIN+3 1"]
          # Systemd as PID1 needs write access to /sys/fs/cgroup. The OCI spec
          # mounts this path read-only. The pod needs privileged mode.
          securityContext:
            privileged: true
          env:
            # NixOS stage 2 checks $container. Set it to docker.
            - name: container
              value: docker
          # TTY provides /dev/console. Without TTY logs do not reach kubectl logs.
          tty: true
          volumeMounts:
            # Keep /nix on PVC: store, Nix db, system and home generations.
            - name: state
              mountPath: /nix
              subPath: nix
            # Keep /home on PVC. Pod recreation keeps the machine state.
            - name: state
              mountPath: /home
              subPath: home
            # Keep SSH host keys on PVC. A new pod must not create a new host key.
            - name: state
              mountPath: /var/lib/ssh
              subPath: ssh
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: devil-data
