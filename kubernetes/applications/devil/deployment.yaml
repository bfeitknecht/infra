apiVersion: apps/v1
kind: Deployment
metadata:
  name: devil
  namespace: devil
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devil
  template:
    metadata:
      labels:
        app: devil
    spec:
      # Kata sets vCPU and RAM from container limits. Without a CPU limit the
      # VM boots with one vCPU. This is too slow for nix builds.
      runtimeClassName: kata-qemu
      hostname: devil
      # Cluster DNS does not work from the kata VM. The VM bypasses ClusterIP.
      # Use the resolver pod IP for DNS.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.244.0.242
      # Devil does not use the Kubernetes API. Do not mount a service account token.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerconfigjson
      # SubPath mounts need the directory. Local-path volumes start as root.
      # Create the home directory for user 1000.
      initContainers:
        - name: init-state
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /volume/home /volume/ssh && chown 1000:100 /volume/home"]
          volumeMounts:
            - name: state
              mountPath: /volume
      containers:
        - name: devil
          image: ghcr.io/bfeitknecht/devil:latest
          # The tag has no effect. The image is only bootstrap. Updates happen
          # inside the VM. Use :latest to pull the newest bootstrap.
          imagePullPolicy: Always
          # The image has no entrypoint. The boot command is here. /init
          # registers the store and boots systemd.
          command: ["/init"]
          # Systemd as PID1 needs write access to /sys/fs/cgroup. The OCI spec
          # mounts this path read-only. The pod needs privileged mode.
          securityContext:
            privileged: true
          env:
            # NixOS stage 2 checks $container. Set it to docker.
            - name: container
              value: docker
          # TTY provides /dev/console. Without TTY logs do not reach kubectl logs.
          tty: true
          volumeMounts:
            # Ghostty-web terminal page. Ttyd serves the page. A new hash
            # restarts the pod.
            - name: ghostty-web
              mountPath: /srv/ghostty-web
              readOnly: true
            # Keep /home on PVC. Pod recreation keeps the machine state.
            - name: state
              mountPath: /home
              subPath: home
            # Keep SSH host keys on PVC. A new pod must not create a new host key.
            - name: state
              mountPath: /var/lib/ssh
              subPath: ssh
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: ghostty-web
          configMap:
            name: devil-ghostty-web
            items:
              - key: index.html
                path: index.html
        - name: state
          persistentVolumeClaim:
            claimName: devil-pvc
