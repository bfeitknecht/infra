<!doctype html>
<!-- literally only an autosized terminal div — ghostty-web (WASM ghostty,
     xterm.js-compatible API, FitAddon supported) from a pinned CDN, wired
     to ttyd's websocket. Server side: ttyd in the devil VM running `login`
     (see omni devil.nix) — the login prompt is the auth.
     Wire protocol (ttyd):
       GET /token -> {"token": ...}
       WS  wss://<host>/ws, subprotocol "ttyd", binary frames
       open:  {AuthToken, columns, rows} (binary-encoded JSON)
       -> '0' + input bytes | '1' + {"columns": c, "rows": r}
       <- '0' + output bytes | '1' + title (ignored, ghostty handles OSC) -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>devil</title>
    <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    #term {
      width: 100vw;
      height: 100vh;
    }
    </style>
  </head>
  <body>
    <div id="term"></div>
    <script type="module">
    import { init, Terminal } from "https://esm.sh/ghostty-web@0.4.0";
    import { FitAddon } from "https://esm.sh/@xterm/addon-fit@0.10.0";

    await init();

    // one theme pair, pure inverse: fff-on-000 and 000-on-fff
    const themes = {
      dark: { background: "#000000", foreground: "#ffffff", cursor: "#ffffff" },
      light: { background: "#ffffff", foreground: "#000000", cursor: "#000000" },
    };

    const term = new Terminal({
      fontSize: 14,
      fontFamily: "CommitMono Nerd Font, Menlo, monospace",
      theme: themes.dark,
    });
    const fit = new FitAddon();
    term.open(document.getElementById("term"));
    term.loadAddon(fit);
    fit.fit();

    const applyTheme = (name) => {
      term.options.theme = themes[name];
      document.body.style.background = themes[name].background;
    };
    // always start dark; the watcher follows the system from then on
    applyTheme("dark");
    matchMedia("(prefers-color-scheme: light)")
      .addEventListener("change", (e) => applyTheme(e.matches ? "light" : "dark"));

    const { token } = await (await fetch("/token")).json();
    const ws = new WebSocket(`wss://${location.host}/ws`, ["ttyd"]);
    ws.binaryType = "arraybuffer";

    const enc = new TextEncoder();

    ws.onopen = () => {
      ws.send(enc.encode(JSON.stringify({
        AuthToken: token,
        columns: term.cols,
        rows: term.rows,
      })));
      term.focus();
    };

    ws.onmessage = (e) => {
      const u = new Uint8Array(e.data);
      const cmd = String.fromCharCode(u[0]);
      const data = e.data.slice(1);
      // '0' output; '1' title and '2' preferences are ttyd-frontend extras
      if (cmd === "0") term.write(new Uint8Array(data));
    };

    term.onData((d) => {
      if (ws.readyState !== WebSocket.OPEN) return;
      const p = new Uint8Array(d.length * 3 + 1);
      p[0] = 0x30; // '0' input
      const s = enc.encodeInto(d, p.subarray(1));
      ws.send(p.subarray(0, s.written + 1));
    });

    term.onResize(({ columns, rows }) => {
      if (ws.readyState !== WebSocket.OPEN) return;
      const m = new Uint8Array(1 + 64);
      m[0] = 0x31; // '1' resize
      m.set(enc.encode(JSON.stringify({ columns, rows })), 1);
      ws.send(m);
    });

    addEventListener("resize", () => fit.fit());
    </script>
  </body>
</html>
