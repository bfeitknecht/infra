apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devil
  namespace: devil
  # Ghostty-web terminal at devil.internal. Ttyd serves ConfigMap page.
  # Login uses PAM password. Allowlist gates access.
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - devil.internal
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        # Headless Service. See service.yaml. No ClusterIP.
        - name: devil
          port: 7681
