apiVersion: v1
kind: Service
metadata:
  name: devil
  namespace: devil
spec:
  # Use headless Service. Kata VM bypasses Cilium service translation.
  # ClusterIP does not reach VM. Use pod IP via Endpoints. Pod-to-pod
  # path works.
  clusterIP: None
  selector:
    app: devil
  ports:
    - name: ssh
      port: 2222
      targetPort: 2222
    - name: ghostty-web
      port: 7681
      targetPort: 7681
