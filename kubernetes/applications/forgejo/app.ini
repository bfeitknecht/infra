; Non-secret Forgejo config. Seeded onto the PVC on first boot only —
; afterwards Forgejo owns this file (UI edits persist); re-seeding requires
; deleting /data/gitea/conf/app.ini from the PVC. The initContainer appends
; the [security] block (INSTALL_LOCK + secrets) from forgejo-secrets.
APP_NAME = 0xbf Forgejo
RUN_USER = git
WORK_PATH = /data/gitea

[server]
DOMAIN = git.0xbf.ch
ROOT_URL = https://git.0xbf.ch/
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
APP_DATA_PATH = /data/gitea
SSH_DOMAIN = git.0xbf.ch
; Port 22 everywhere (Traefik gitssh entrypoint + hostPort 22); the future
; dev box takes WAN 2222 instead.
SSH_PORT = 22
SSH_LISTEN_PORT = 22
LFS_START_SERVER = true

[repository]
ROOT = /data/git/repositories

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/gitea.db

[service]
DISABLE_REGISTRATION = true

[mailer]
ENABLED = false

[log]
MODE = console

[time]
DEFAULT_UI_LOCATION = Europe/Zurich
