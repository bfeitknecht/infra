; Non-secret Forgejo config. Seeded onto the PVC on first boot only —
; afterwards Forgejo owns this file (UI edits persist); re-seeding requires
; deleting /data/gitea/conf/app.ini from the PVC. The initContainer appends
; the [security] block (INSTALL_LOCK + secrets) from forgejo-secrets.
APP_NAME = 0xbf Forgejo
RUN_USER = git
WORK_PATH = /data/gitea

[server]
DOMAIN = git.0xbf.ch
ROOT_URL = https://git.0xbf.ch/
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
APP_DATA_PATH = /data/gitea
SSH_DOMAIN = git.0xbf.ch
; SSH_PORT is the clone URL port (Traefik gitssh, hostPort and WAN 22 since
; v1.42.0; 2223 is devil). SSH_LISTEN_PORT is the container port behind
; Service forgejo:22.
SSH_PORT = 22
SSH_LISTEN_PORT = 22
LFS_START_SERVER = true
; The stock home page says nothing; signed-out visitors land on the profile's
; public activity feed (pushes, repos, issues, heatmap). Signed in, / is the
; dashboard.
LANDING_PAGE = /bf?tab=activity

[repository]
ROOT = /data/git/repositories

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/gitea.db

[service]
; Sign-up only through authentik (login source "authentik", group developers).
DISABLE_REGISTRATION = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = true
SHOW_REGISTRATION_BUTTON = false
; Login only through authentik (its passkey/TOTP is the second factor; no
; Forgejo-local 2FA on users). No local form: break-glass is `forgejo admin`
; over kubectl exec.
ENABLE_INTERNAL_SIGNIN = false

[mailer]
; Enabled by FORGEJO__mailer__* env in deployment.yaml (Proton SMTP).
ENABLED = false

[log]
MODE = console

[time]
DEFAULT_UI_LOCATION = Europe/Zurich

[oauth2_client]
ENABLE_AUTO_REGISTRATION = true
USERNAME = nickname
ACCOUNT_LINKING = login
UPDATE_AVATAR = false

[actions]
; Forgejo Actions with the runner in applications/forgejo-runner (rzbl).
ENABLED = true
DEFAULT_ACTIONS_URL = https://code.forgejo.org

[ui]
; One theme: signed in looks like signed out (a stored user theme that is
; not listed falls back to DEFAULT_THEME).
THEMES = 0xbf
DEFAULT_THEME = 0xbf
