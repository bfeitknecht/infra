apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  # Use Recreate. SQLite and repos use RWO volume. Two instances cannot
  # share the data.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      initContainers:
        # Seed app.ini on first boot. Create admin user. Forgejo owns data
        # after that. Create both directories. Local-path does not create
        # subPath directories.
        - name: config-seed
          image: codeberg.org/forgejo/forgejo:16.0.5
          command: ["sh", "/seed/init.sh"]
          env:
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: admin-user
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: admin-password
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: admin-email
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config-seed
              mountPath: /seed
              readOnly: true
            - name: seed-secrets
              mountPath: /seed-secrets
              readOnly: true
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.5
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          volumeMounts:
            - name: data
              mountPath: /data
            - name: branding
              mountPath: /data/gitea/public/assets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: branding
          projected:
            sources:
              - configMap:
                  name: forgejo-branding
                  items:
                    - {key: logo.svg, path: img/logo.svg}
                    - {key: favicon.svg, path: img/favicon.svg}
                    - {key: theme-0xbf.css, path: css/theme-0xbf.css}
              - configMap:
                  name: forgejo-branding-png
                  items:
                    - {key: logo.png, path: img/logo.png}
                    - {key: favicon.png, path: img/favicon.png}
                    - {key: apple-touch-icon.png, path: img/apple-touch-icon.png}
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: config-seed
          configMap:
            name: forgejo-config
        - name: seed-secrets
          secret:
            secretName: forgejo-secrets
            items:
              - key: secret-key
                path: secret-key
              - key: internal-token
                path: internal-token
