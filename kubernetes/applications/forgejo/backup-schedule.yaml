apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: forgejo-backup
  namespace: forgejo
spec:
  # Times use Europe/Zurich. Jobs fail until NAS path is fixed. This is expected.
  backup:
    schedule: "0 3 * * *"
    failedJobsHistoryLimit: 3
  prune:
    schedule: "0 5 * * *"
    failedJobsHistoryLimit: 3
    retention:
      keepLast: 5
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
