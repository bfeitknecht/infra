apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - tcproute.yaml
  - backup-schedule.yaml
  - forgejo-secrets.sops.yaml
configMapGenerator:
  - name: forgejo-config
    files:
      - app.ini
      - init.sh
  # Logo, favicon and theme. Mounted at /data/gitea/public/assets (custom path).
  - name: forgejo-branding
    files:
      - branding/logo.svg
      - branding/logo.png
      - branding/favicon.svg
      - branding/favicon.png
      - branding/apple-touch-icon.png
      - branding/theme-0xbf.css
