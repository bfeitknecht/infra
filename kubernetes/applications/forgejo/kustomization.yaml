apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - tcproute.yaml
  - backup-schedule.yaml
  - forgejo-secrets.sops.yaml
configMapGenerator:
  - name: forgejo-config
    files:
      - app.ini
      - init.sh
