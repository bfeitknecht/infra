# PNG logo files as binaryData. Not plain .png files in git: flux push artifact
# drops *.png by default (Flux ignore list), so the build cannot find them.
# Regenerate from branding/*.svg sources if the logo changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-branding-png
  namespace: forgejo
binaryData:
  logo.png: 
  favicon.png: 
  apple-touch-icon.png: 
