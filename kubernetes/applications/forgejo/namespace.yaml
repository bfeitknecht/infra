apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
  labels:
    # Forgejo's s6 supervisor and in-container sshd run as root; baseline
    # allows that without the host-level privileges agh/ingress need.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
