# static-web-server. Use this file for settings that ENV cannot define.
#
# 1. Root is /data/public. This is the Hugo output. The default root is the
#    image home directory. Without this setting the server serves the wrong files.
# 2. Health endpoints /livez and /readyz need health = true. Without this,
#    the endpoints are disabled by default.
# 3. Cache-Control is no-cache for HTML, XML and media. Clients revalidate
#    and new uploads are visible immediately.
# 4. Cache-Control is immutable for css/** and fonts/**. These files have a
#    content hash, so long caching is safe.
[general]
root = "/data/public"
health = true

[advanced]

[[advanced.headers]]
source = "**"
headers = { Cache-Control = "no-cache" }

[[advanced.headers]]
source = "**/css/**"
headers = { Cache-Control = "public, max-age=31536000, immutable" }

[[advanced.headers]]
source = "**/fonts/**"
headers = { Cache-Control = "public, max-age=31536000, immutable" }
