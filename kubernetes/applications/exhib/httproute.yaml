apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exhib
  namespace: exhib
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - glry.0xbf.ch
  rules:
    # authentik forward auth callback (sign-in, sign-out) on this host.
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    # The web uploader: authentik app `exhib`, bound to user bf.
    - matches:
        - path:
            type: PathPrefix
            value: /upload
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - name: exhib
          port: 8081
    - backendRefs:
        - name: exhib
          port: 80
---
# The old hostname, kept for links and feed readers: 301 to the same path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exhib-redirect
  namespace: exhib
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure
  hostnames:
    - gallery.0xbf.ch
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: glry.0xbf.ch
            statusCode: 301
