apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-nvme
  resources:
    requests:
      storage: 1Gi
---
# Namespace media (not qbittorrent): the pod shares media-files with the *arr apps.
# All torrent traffic leaves through gluetun (Proton VPN WireGuard). Kill switch:
# gluetun's firewall drops everything outside the tunnel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      automountServiceAccountToken: false
      initContainers:
        # Native sidecar: starts first, runs for the pod lifetime.
        - name: gluetun
          image: docker.io/qmcgaw/gluetun:v3.41.3
          restartPolicy: Always
          env:
            - name: VPN_SERVICE_PROVIDER
              value: protonvpn
            - name: VPN_TYPE
              value: wireguard
            - name: SERVER_COUNTRIES
              value: Switzerland
            # Proton forwards one port (NAT-PMP) on P2P servers only.
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: VPN_PORT_FORWARDING
              value: "on"
            # Push the forwarded port to qBittorrent. Needs "Bypass authentication
            # for clients on localhost" in the qBittorrent Web UI settings.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: /bin/sh -c 'wget -qO- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences'
            # Web UI must stay reachable from the cluster (Service, kubelet probe).
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: TZ
              value: Europe/Zurich
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-secrets
                  key: WIREGUARD_PRIVATE_KEY
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.3.0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Zurich
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            # Same path as in sonarr/radarr: downloads in /data/downloads.
            - name: files
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-data
        - name: files
          persistentVolumeClaim:
            claimName: media-files
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - qbittorrent.internal
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: qbittorrent
          port: 80
