apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-nvme
  resources:
    requests:
      storage: 1Gi
---
# Namespace media (not qbittorrent): the pod shares media-files with the *arr apps.
# All torrent traffic leaves through gluetun (Proton VPN WireGuard). Kill switch:
# gluetun's firewall drops everything outside the tunnel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      automountServiceAccountToken: false
      initContainers:
        # Native sidecar: starts first, runs for the pod lifetime.
        - name: gluetun
          image: docker.io/qmcgaw/gluetun:v3.41.3
          restartPolicy: Always
          env:
            - name: VPN_SERVICE_PROVIDER
              value: protonvpn
            - name: VPN_TYPE
              value: wireguard
            - name: SERVER_COUNTRIES
              value: Switzerland
            # Proton forwards one port (NAT-PMP) on P2P servers only.
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: VPN_PORT_FORWARDING
              value: "on"
            # Push the forwarded port to qBittorrent. Needs "Bypass authentication
            # for clients on localhost" in the qBittorrent Web UI settings.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: /bin/sh -c 'wget -qO- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences'
            # Web UI must stay reachable from the cluster (Service, kubelet probe).
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: TZ
              value: Europe/Zurich
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-secrets
                  key: WIREGUARD_PRIVATE_KEY
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
        # Git owns these qBittorrent settings: set on every start, UI edits to
        # them are overwritten. No seeding: ratio 0 and 0 minutes, then the
        # torrent stops; Sonarr/Radarr import it and remove it. Auth bypass for
        # localhost (gluetun port push) and the pod CIDR (the *arr apps;
        # people reach the UI only through authentik).
        - name: settings
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              set -eu
              f=/config/qBittorrent/qBittorrent.conf
              mkdir -p /config/qBittorrent
              touch "$f"
              set_key() { # section key value
                # values through ENVIRON: awk -v would eat the backslashes
                SEC="[$1]" KEY="$2" VAL="$3" awk '
                  BEGIN { sec = ENVIRON["SEC"]; key = ENVIRON["KEY"]; val = ENVIRON["VAL"]; done = 0 }
                  /^\[/ { if (insec && !done) { print key "=" val; done = 1 } insec = ($0 == sec) }
                  insec && index($0, key "=") == 1 { if (!done) { print key "=" val; done = 1 } next }
                  { print }
                  END { if (!done) { if (!insec) print sec; print key "=" val } }
                ' "$f" > "$f.new" && mv "$f.new" "$f"
              }
              set_key BitTorrent 'Session\DefaultSavePath' /data/torrents
              set_key BitTorrent 'Session\TempPathEnabled' false
              set_key BitTorrent 'Session\GlobalMaxRatio' 0
              set_key BitTorrent 'Session\GlobalMaxSeedingMinutes' 0
              set_key BitTorrent 'Session\GlobalMaxInactiveSeedingMinutes' 0
              set_key BitTorrent 'Session\ShareLimitAction' Stop
              # qBittorrent 5 keeps Web UI keys in [WebUI] (not Preferences\WebUI\).
              set_key WebUI LocalHostAuth false
              set_key WebUI AuthSubnetWhitelistEnabled true
              set_key WebUI AuthSubnetWhitelist 10.244.0.0/16
              grep -v -E '^WebUI\\(LocalHostAuth|AuthSubnetWhitelist)' "$f" > "$f.new" && mv "$f.new" "$f"
              chown 1000:1000 "$f"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.3.0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Zurich
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            # Same /data path as jellyfin and the *arr apps (TRaSH layout).
            - name: files
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-data
        - name: files
          persistentVolumeClaim:
            claimName: media-files
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - qbittorrent.internal
  rules:
    # authentik forward auth callback (sign-in, sign-out) on this host.
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - name: qbittorrent
          port: 80
