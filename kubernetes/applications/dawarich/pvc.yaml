apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-db
  namespace: dawarich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-nvme
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-data
  namespace: dawarich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-nvme
  resources:
    requests:
      storage: 20Gi
