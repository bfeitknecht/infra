apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dawarich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dawarich
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      containers:
        - name: dawarich
          image: docker.io/freikin/dawarich:1.23.0
          command: ["web-entrypoint.sh"]
          args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
          env:
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: redis://dawarich-redis:6379
            - name: DATABASE_HOST
              value: dawarich-db
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USERNAME
              value: postgres
            - name: DATABASE_NAME
              value: dawarich
            - name: APPLICATION_HOSTS
              value: dawarich.internal
            - name: APPLICATION_PROTOCOL
              value: http
            - name: TIME_ZONE
              value: Europe/Zurich
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: SELF_HOSTED
              value: "true"
            # Login with authentik: public client, PKCE, discovery.
            - name: OIDC_CLIENT_ID
              value: dawarich
            - name: OIDC_PKCE_ENABLED
              value: "true"
            - name: OIDC_DISCOVERY
              value: "true"
            - name: OIDC_ISSUER
              value: https://auth.0xbf.ch/application/o/dawarich/
            - name: OIDC_REDIRECT_URI
              value: https://dawarich.internal/users/auth/openid_connect/callback
            - name: OIDC_PROVIDER_NAME
              value: "0xbf"
            - name: OIDC_AUTO_REGISTER
              value: "true"
            - name: STORE_GEODATA
              value: "true"
            # Sidekiq runs in the web process. No separate worker Deployment.
            - name: SIDEKIQ_EMBEDDED
              value: "true"
            - name: WEB_CONCURRENCY
              value: "0"
            - name: BACKGROUND_PROCESSING_CONCURRENCY
              value: "2"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: SECRET_KEY_BASE
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: storage
              mountPath: /var/app/storage
              subPath: storage
            - name: storage
              mountPath: /var/app/public
              subPath: public
            - name: storage
              mountPath: /var/app/tmp/imports/watched
              subPath: watched
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: dawarich-data
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich
  namespace: dawarich
spec:
  selector:
    app.kubernetes.io/name: dawarich
  ports:
    - name: main
      port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dawarich
  namespace: dawarich
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: websecure-internal
  hostnames:
    - dawarich.internal
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: internal-allowlist
      backendRefs:
        - name: dawarich
          port: 80
