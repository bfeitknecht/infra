apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-redis
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dawarich-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dawarich-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: rzbl
      enableServiceLinks: false
      containers:
        - name: redis
          image: docker.io/redis:8-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich-redis
  namespace: dawarich
spec:
  selector:
    app.kubernetes.io/name: dawarich-redis
  ports:
    - name: main
      port: 6379
      targetPort: 6379
