apiVersion: v1
kind: Service
metadata:
  name: agh
  namespace: agh
spec:
  type: LoadBalancer
  # Static from the lan-pool: the router's DHCP DNS field and Tailscale split
  # DNS point here, so the address must never float (Gateway holds .128).
  # Same IP the router/tailnet already use — inherited from Pi-hole.
  loadBalancerIP: 10.10.20.153
  selector:
    app: agh
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
