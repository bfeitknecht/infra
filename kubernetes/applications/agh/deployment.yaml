apiVersion: apps/v1
kind: Deployment
metadata:
  name: agh
  namespace: agh
spec:
  replicas: 1
  # Use Recreate. The volume is RWO. Two instances cannot share the data.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agh
  template:
    metadata:
      labels:
        app: agh
    spec:
      initContainers:
        # Seed config on first boot only. AGH owns the file after that.
        # UI edits persist on PVC. Create both directories. Local-path does
        # not create subPath directories.
        - name: config-seed
          image: docker.io/busybox:1.37.0
          command: ["sh", "-c", "mkdir -p /agh-data/conf /agh-data/work && [ -f /agh-data/conf/AdGuardHome.yaml ] || cp /agh-seed/AdGuardHome.yaml /agh-data/conf/AdGuardHome.yaml"]
          volumeMounts:
            - name: data
              mountPath: /agh-data
            - name: config-seed
              mountPath: /agh-seed
              readOnly: true
      containers:
        - name: agh
          image: docker.io/adguard/adguardhome:v0.107.79
          args:
            - "-c"
            - "/agh-data/conf/AdGuardHome.yaml"
            - "-w"
            - "/agh-data/work"
            - "--no-check-update"
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 80
              name: http
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /agh-data
          resources:
            requests:
              cpu: 32m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            # Check DNS. DNS is the main service.
            tcpSocket:
              port: 53
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agh-data
        - name: config-seed
          secret:
            secretName: agh-config
