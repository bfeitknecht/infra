apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-allowlist
  namespace: agh
spec:
  ipAllowList:
    sourceRange:
      - 10.10.0.0/16
      # Middleware must be in the route namespace. HTTPRoute ExtensionRef
      # has no namespace field. Copy the ingress middleware here.
      - 100.64.0.0/10
