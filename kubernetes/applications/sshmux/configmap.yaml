# The mux state. users: "username:password-login" (yes = public empty
# password, the apex path; no = owner key only). sshd_config: the username
# routes (Match User blocks) + the default ForceCommand to apex.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sshmux-config
  namespace: sshmux
data:
  users: |
    # Owner key, no password: the mux front itself.
    bf:no
    # The public apex path: any of these usernames, press Enter at the
    # password prompt. Unknown usernames do not exist here: SSH cannot
    # have wildcard accounts.
    someone:yes
    apex:yes
    guest:yes
  sshd_config: |-
    Port 22
    ListenAddress 0.0.0.0
    HostKey /etc/ssh/keys/host_ed25519
    HostKey /etc/ssh/keys/host_rsa
    PermitRootLogin no
    PubkeyAuthentication yes
    # The public apex path: empty passwords (press Enter). The owner never
    # sees the password prompt: pubkey wins first.
    PasswordAuthentication yes
    PermitEmptyPasswords yes
    KbdInteractiveAuthentication no
    UsePAM no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY yes
    PrintMotd no
    PrintLastLog no
    MaxSessions 5
    # The default route: every username below rides the apex portfolio.
    ForceCommand /usr/local/bin/to-apex
