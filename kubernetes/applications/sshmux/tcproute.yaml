# WAN 2222 lands here (listener muxssh, hostPort on rbpi). The route is raw
# TCP: the client's SSH handshake with the mux stays end-to-end.
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: sshmux
  namespace: sshmux
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: muxssh
  rules:
    - backendRefs:
        - name: sshmux
          port: 22
