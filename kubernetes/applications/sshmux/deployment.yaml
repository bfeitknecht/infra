apiVersion: apps/v1
kind: Deployment
metadata:
  name: sshmux
  namespace: sshmux
  labels:
    app.kubernetes.io/name: sshmux
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sshmux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sshmux
    spec:
      nodeSelector:
        kubernetes.io/hostname: rbpi
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: sshmux
          # In-tree image (images/sshmux). The pin must match the release
          # tag (`just release` checks).
          image: ghcr.io/bfeitknecht/sshmux:v1.78.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 22
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 60
          volumeMounts:
            - name: config
              mountPath: /etc/ssh/mux
              readOnly: true
            - name: keys
              mountPath: /etc/ssh/keys
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sshmux-config
        - name: keys
          secret:
            secretName: sshmux-keys
            # sshd refuses host keys readable by others: 0400.
            items:
              - key: host_ed25519
                path: host_ed25519
                mode: 0400
              - key: host_rsa
                path: host_rsa
                mode: 0400
              - key: authorized_keys
                path: authorized_keys
                mode: 0444
