---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apex
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik
  interval: 10m0s
  path: ./kubernetes/applications/apex
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  ignore:
    - paths:
        - /spec/template/spec/containers/0/image
      target:
        kind: Deployment
        name: apex
    - paths:
        - /spec/template/spec/containers/0/image
      target:
        kind: Deployment
        name: apex-tui
