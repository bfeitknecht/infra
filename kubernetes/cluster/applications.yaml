apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dns
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/applications/dns
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agh
  namespace: flux-system
spec:
  dependsOn:
    - name: storage
    - name: dns
    - name: traefik
  interval: 10m0s
  path: ./kubernetes/applications/agh
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
