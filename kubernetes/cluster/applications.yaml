    kind: OCIRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  dependsOn:
    - name: storage
    - name: traefik
    # Schedule CRD only. Not "backup": a k8up fault must not block login.
    - name: k8up-crds
  interval: 10m0s
  path: ./kubernetes/applications/authentik
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  # Prepared, not deployed. Owner creates the sops Secret first.
  # See docs/RZBL_WORKLOADS.md. Then remove this line.
  suspend: true
  dependsOn:
    - name: media
  interval: 10m0s
  path: ./kubernetes/applications/qbittorrent
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate
  namespace: flux-system
spec:
  # Prepared, not deployed. Owner creates the sops Secret first.
  # See docs/RZBL_WORKLOADS.md. Then remove this line.
  suspend: true
  interval: 10m0s
  path: ./kubernetes/applications/renovate
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  decryption:
    provider: sops
