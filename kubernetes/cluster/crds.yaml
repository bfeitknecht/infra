apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.6.2
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: false
  # experimental bundle: superset of standard (same v1.6.2 tag) — adds
  # TCPRoute/UDPRoute/TLSRoute, needed for the forgejo git-ssh TCPRoute
  path: ./config/crd/experimental
  sourceRef:
    kind: GitRepository
    name: gateway-api
---
