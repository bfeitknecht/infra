apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.6.2
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: false
  # Experimental bundle adds TCPRoute. Standard is subset. Same tag v1.6.2.
  # Forgejo git-ssh needs TCPRoute.
  path: ./config/crd/experimental
  sourceRef:
    kind: GitRepository
    name: gateway-api
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: traefik-crds
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/traefik/traefik-helm-chart
  ref:
    tag: v41.6.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: false
  path: ./traefik/crds
  sourceRef:
    kind: GitRepository
    name: traefik-crds
  # Traefik Hub CRDs are unused (no Hub). Each CRD costs apiserver memory.
  patches:
    - target:
        kind: CustomResourceDefinition
        name: ".*\\.hub\\.traefik\\.io"
      patch: |
        $patch: delete
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: unused
---
