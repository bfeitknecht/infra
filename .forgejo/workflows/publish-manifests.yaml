# Mirror of .github/workflows/publish-manifests.yaml for a Forgejo runner.
# Differences:
#   - runs-on: the cluster forgejo-runner label
#   - the GHCR logins read the GHCR_TOKEN secret: add it in the repository
#     settings with a GitHub PAT (write:packages). Forgejo has no implicit
#     GITHUB_TOKEN that can push to ghcr.io.
name: Publish OCI Artifact

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up QEMU
        uses: https://github.com/docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: https://github.com/docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: https://github.com/docker/login-action@v4
        with:
          registry: ghcr.io
          username: bfeitknecht
          password: ${{ secrets.GHCR_TOKEN }}

      # amd64 only: the opencode VM runs on rzbl.
      - name: Build and push opencode image
        uses: docker/build-push-action@v6
        with:
          context: images/opencode
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bfeitknecht/opencode:${{ github.ref_name }}

      # arm64 only: the mux runs on rbpi (Pi 5).
      - name: Build and push sshmux image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: images/sshmux
          platforms: linux/arm64
          push: true
          tags: ghcr.io/bfeitknecht/sshmux:${{ github.ref_name }}

      - name: Setup Flux CLI
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v2.9.6/flux_2.9.6_linux_arm64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" flux
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish OCI Artifact to GHCR
        run: |
          flux push artifact oci://ghcr.io/bfeitknecht/infra:${{ github.ref_name }} \
            --path="./" \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${{ github.ref_name }}"
