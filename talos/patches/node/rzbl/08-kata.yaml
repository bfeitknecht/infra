# Kata (rzbl): our own copy of the qemu config, so one setting can change.
# Kata backs each VM's RAM with /dev/shm (8.3 GB here; devil and opencode
# share it). A full shm kills qemu with SIGBUS (2026-11-25). With
# reclaim_guest_freed_memory the balloon reports freed guest pages and qemu
# returns them to the host, so shm shrinks again.
#
# The file is the stock configuration-qemu.toml of the Kata extension
# (kata-containers 4.3.1, comments removed) with that one value changed.
# After a Kata extension upgrade, diff against the new stock file:
#   talosctl -n 10.10.20.11 read /usr/local/share/kata-containers/configuration-qemu.toml
# machine.files are written at boot: a change here needs a reboot of rzbl.
machine:
  files:
    - path: /var/etc/kata-containers/configuration-qemu.toml
      permissions: 0o644
      op: create
      content: |
        [hypervisor.qemu]
        path = "/usr/local/bin/qemu-system-x86_64"
        kernel = "/usr/local/share/kata-containers/vmlinux.container"
        image = "/usr/local/share/kata-containers/kata-containers.img"
        machine_type = "q35"
        rootfs_type = "ext4"
        rootless = false
        enable_annotations = ["enable_iommu", "kernel_params", "kernel_verity_params"]
        valid_hypervisor_paths = ["/usr/local/bin/qemu-system-x86_64"]
        kernel_params = "cgroup_no_v1=all systemd.unified_cgroup_hierarchy=1"
        firmware = ""
        firmware_volume = ""
        machine_accelerators = ""
        seccompsandbox = ""
        cpu_features = "pmu=off"
        default_vcpus = 1
        default_maxvcpus = 0
        default_bridges = 1
        default_memory = 2048
        memory_slots = 10
        default_maxmemory = 0
        memory_offset = 0
        enable_virtio_mem = false
        disable_block_device_use = true
        shared_fs = "virtio-fs"
        virtio_fs_daemon = "/usr/local/libexec/virtiofsd"
        valid_virtio_fs_daemon_paths = ["/usr/local/libexec/virtiofsd"]
        virtio_fs_cache_size = 0
        virtio_fs_queue_size = 1024
        virtio_fs_extra_args = ["--thread-pool-size=1", "--announce-submounts"]
        virtio_fs_cache = "auto"
        block_device_driver = "virtio-scsi"
        block_device_aio = "io_uring"
        block_device_cache_set = false
        block_device_cache_direct = false
        block_device_cache_noflush = false
        block_device_logical_sector_size = 0
        block_device_physical_sector_size = 0
        enable_iothreads = false
        indep_iothreads = 0
        enable_mem_prealloc = false
        reclaim_guest_freed_memory = true
        enable_hugepages = false
        enable_vhost_user_store = false
        vhost_user_store_path = "/var/run/kata-containers/vhost-user"
        enable_iommu = false
        enable_iommu_platform = false
        enable_numa = false
        numa_mapping = []
        valid_vhost_user_store_paths = ["/var/run/kata-containers/vhost-user"]
        vhost_user_reconnect_timeout_sec = 0
        pflashes = []
        enable_debug = false
        extra_monitor_socket = ""
        disable_nesting_checks = false
        msize_9p = 8192
        disable_image_nvdimm = false
        hot_plug_vfio = "no-port"
        cold_plug_vfio = "no-port"
        pcie_root_port = 0
        disable_vhost_net = false
        entropy_source= "/dev/urandom"
        valid_entropy_sources = ["/dev/urandom","/dev/random",""]
        guest_hook_path = ""
        rx_rate_limiter_max_rate = 0
        tx_rate_limiter_max_rate = 0
        guest_memory_dump_path = ""
        guest_memory_dump_paging = false
        enable_guest_swap = false
        use_legacy_serial = false
        disable_selinux = false
        disable_guest_selinux = true
        [factory]
        enable_template = false
        template_path = "/run/vc/vm/template"
        vm_cache_number = 0
        vm_cache_endpoint = "/var/run/kata-containers/cache.sock"
        [agent.kata]
        enable_debug = false
        enable_tracing = false
        kernel_modules = []
        debug_console_enabled = false
        dial_timeout = 45
        cdh_api_timeout = 50
        [runtime]
        enable_debug = false
        internetworking_model = "tcfilter"
        disable_guest_seccomp = true
        enable_vcpus_pinning = false
        guest_selinux_label = ""
        enable_tracing = false
        jaeger_endpoint = ""
        jaeger_user = ""
        jaeger_password = ""
        disable_new_netns = false
        sandbox_cgroup_only = false
        static_sandbox_resource_mgmt = false
        sandbox_bind_mounts = []
        vfio_mode = "guest-kernel"
        disable_guest_empty_dir = true
        emptydir_mode = "shared-fs"
        experimental = []
        enable_pprof = false
        create_container_timeout = 60
        dan_conf = "/run/kata-containers/dans"
        kubelet_root_dir = "/var/lib/kubelet"
        pod_resource_api_sock = ""
    # Talos merges this part last: the kata-qemu handler reads our file.
    - path: /etc/cri/conf.d/20-customization.part
      permissions: 0o644
      op: create
      content: |
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata-qemu.options]
          ConfigPath = "/var/etc/kata-containers/configuration-qemu.toml"
