name: Publish Image

# Reusable workflow for tier-2 build and push. One copy for all app repos.
#
# Caller job:
#   jobs:
#     publish:
#       permissions:
#         contents: read
#         packages: write
#       uses: bfeitknecht/infra/.github/workflows/publish-image.yaml@master
#
# Image name comes from caller repository. In called workflow github.context
# belongs to caller. No inputs needed. App repo needs no extra config.
#
# Infra is public. Public repos can call reusable workflows only from
# public repos.

on:
  workflow_call:
    inputs:
      platforms:
        description: Target platforms for the build.
        required: false
        type: string
        default: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
