name: Publish Image

# Reusable workflow — the single copy of the tier-2 build+push logic.
#
# Each app repo calls it with a job like:
#
#   jobs:
#     publish:
#       permissions:
#         contents: read
#         packages: write
#       uses: bfeitknecht/infra/.github/workflows/publish-image.yaml@master
#
# The image name is derived from the caller's repository: in a called workflow
# the `github` context always belongs to the caller, so `github.repository` is
# the app repo and no inputs are needed.
#
# NOTE: a public repository can only call reusable workflows that live in a
# public repository. `infra` is private, so public app repos cannot call this
# until either `infra` is made public or the app repos are made private (with
# this repo's Actions access policy granting them).

on:
  workflow_call:
    inputs:
      platforms:
        description: Target platforms for the build.
        required: false
        type: string
        default: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
