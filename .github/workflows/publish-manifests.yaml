# Publishes the OCI artifact (Flux source) and, from the same tag, the
# opencode image (a Nix build from omni, pinned by images/opencode/flake.lock).
# Image tags equal the git tag, so the Deployment pin matches what CI
# publishes. The image builds first:
# Flux may reconcile the artifact as soon as it exists, and a manifest whose
# image is still pushing would crash-loop.
name: Publish OCI Artifact

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0, v1.0.1, etc.

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The opencode image is a Nix build defined in omni
      # (modules/images/opencode.nix); images/opencode/flake.lock pins omni.
      - name: Install Nix
        uses: cachix/install-nix-action@v32

      - name: Build and push opencode image
        run: |
          nix build ./images/opencode#default -o opencode-image
          docker load < opencode-image
          docker tag ghcr.io/bfeitknecht/opencode:dev ghcr.io/${{ github.repository_owner }}/opencode:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/opencode:${{ github.ref_name }}

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.9.6

      # --ignore-paths is the flux default minus *.png: kustomize
      # configMapGenerator files (branding icons) must be in the artifact.
      - name: Publish OCI Artifact to GHCR
        run: |
          flux push artifact oci://ghcr.io/${{ github.repository_owner }}/infra:${{ github.ref_name }} \
            --path="./" \
            --ignore-paths=".git/,.gitignore,.gitmodules,.gitattributes,*.jpg,*.jpeg,*.gif,*.wmv,*.flv,*.tar.gz,*.zip" \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${{ github.ref_name }}"
