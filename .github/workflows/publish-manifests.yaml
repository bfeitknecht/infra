# Publishes the OCI artifact (Flux source) and, from the same tag, the
# in-tree image (opencode). Image tags equal the git tag, so the
# Deployment pin in-tree matches what CI publishes. The image builds first:
# Flux may reconcile the artifact as soon as it exists, and a manifest whose
# image is still pushing would crash-loop.
name: Publish OCI Artifact

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0, v1.0.1, etc.

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: the opencode VM runs on rzbl.
      - name: Build and push opencode image
        uses: docker/build-push-action@v6
        with:
          context: images/opencode
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/opencode:${{ github.ref_name }}

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.9.6

      - name: Publish OCI Artifact to GHCR
        run: |
          flux push artifact oci://ghcr.io/${{ github.repository_owner }}/infra:${{ github.ref_name }} \
            --path="./" \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${{ github.ref_name }}"
