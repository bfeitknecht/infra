# Format and build gate. Same two checks as `just release`: the tree must be
# canonically formatted (yamlfmt, `.yamlfmt`) and every Flux Kustomization
# path must build. yamlfmt is pinned: the brew formula moves, and the repo
# style must not.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # The action that just's README names. install.sh asked the GitHub API
      # without a token and hit its rate limit (2 of 8 runs, 2026-11-26/27).
      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install yamlfmt (pinned)
        run: |
          set -eu
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: just fmt --check

      - name: Build all Kustomizations, CRD tags match their charts
        run: just check
